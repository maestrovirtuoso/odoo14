# ---------------------------------------------------------------------------
# Hotes physiques (Rocky 8). Chacun heberge un conteneur LXC.
#   192.168.36.21-23 : conteneurs Odoo, carte enp5s0
#   192.168.33.21-23 : conteneurs PostgreSQL, carte enp1s0
# Carte, IP, passerelle et DNS de chaque conteneur : host_vars/<ip>.yml.
# ---------------------------------------------------------------------------
[gluster_servers]
192.168.36.21 ansible_user=root
192.168.36.22 ansible_user=root
192.168.36.23 ansible_user=root
192.168.33.21 ansible_user=root
192.168.33.22 ansible_user=root
192.168.33.23 ansible_user=root

[gluster_servers:vars]
# Les hotes n'ont qu'une carte sur leur reseau, et elle porte leur route par
# defaut : la ceder au conteneur (mode phys) couperait l'hote. Les conteneurs
# sont donc poses en MACVLAN sur cette carte, que l'hote garde.
# Consequence : un hote ne joint pas son propre conteneur (cf. roles/lxc_lan).
lxc_net_type=macvlan
#
# L'ancien modele routé du lab (10.0.x.0/24) n'existe pas sur ces hotes. Ne
# pas laisser lxc_lan y supprimer des routes 10.0.x.0/24 : 10.0.3.0/24 est
# celle de lxcbr0, qui peut encore servir tant que la migration n'est pas
# validee.
lxc_undo_routed=false
#
# Carte par defaut, surchargee par chaque host_vars/<ip>.yml.
# Cette variable venait de inventory-lxc.ini, qui declarait sous le nom
# "lxc_nodes" exactement les memes quatre hotes que ce groupe. Un seul
# inventaire desormais : deux listes d'hotes a tenir a jour finissent
# toujours par diverger.
nic=ens224

# ---------------------------------------------------------------------------
# Hotes Odoo CLIENTS du volume GlusterFS replique "sre", servi par
# 192.168.36.8 (gluster_server, group_vars/all). Le role odoo_filestore y
# monte le volume sur /mnt/odoo et le passe au conteneur sur /var/lib/odoo.
#
# Le nom du groupe est HISTORIQUE : ces hotes ne portent plus aucune brique,
# le volume est sur des serveurs externes. Il est garde parce que
# ansi_syncro, odoo_migration et group_vars/gluster_bricks en dependent.
#
# Sous-ensemble STRICT de gluster_servers : les hotes 192.168.33.x portent
# les conteneurs PostgreSQL. Leur appliquer odoo_filestore ecrirait un
# lxc.mount.entry vers /var/lib/odoo dans un conteneur qui n'heberge pas Odoo.
#
# Le nom du groupe parent est trompeur : gluster_servers designe les quatre
# hotes physiques, pour des raisons historiques, et aucun d'eux n'executait de
# tache Gluster avant ce groupe-ci.
# ---------------------------------------------------------------------------
[gluster_bricks]
192.168.36.21
192.168.36.22
192.168.36.23

# ---------------------------------------------------------------------------
# Hote porteur des sauvegardes (role odoo_backup).
#
# Doit etre un hote Gluster : il lui faut le filestore monte sur
# /srv/odoo-filestore pour l'archiver.
#
# NE PAS y mettre un hote 192.168.33.x : il porte un conteneur PostgreSQL, et ranger les
# sauvegardes d'une base sur la machine qui la porte fait perdre la donnee et
# sa copie du meme coup.
#
# Un seul hote suffit : la base est unique et le filestore est repliquee ×3
# avec un contenu identique sur les trois bricks. Sauvegarder depuis les trois
# archiverait trois fois la meme chose.
# ---------------------------------------------------------------------------
[backup_host]
192.168.36.21

# ---------------------------------------------------------------------------
# Conteneurs LXC. Ils sont exposes DIRECTEMENT sur le LAN par une interface
# macvlan (lxc.net.0.type = macvlan), donc joignables en SSH sans
# rebond : le ProxyCommand de l'ancienne architecture routee a disparu.
# lxc_host indique quel hote porte le conteneur (utile aux roles qui
# agissent sur l'hote a partir du conteneur).
# ---------------------------------------------------------------------------
[odoo_containers]
odoo1 ansible_host=192.168.36.151 lxc_host=192.168.36.21
odoo2 ansible_host=192.168.36.152 lxc_host=192.168.36.22
odoo3 ansible_host=192.168.36.153 lxc_host=192.168.36.23

# Noeud qui initialise la base partagee et porte les taches planifiees.
# Il doit rester UNIQUE : trois "odoo -i base" concurrents sur la meme base
# corrompent le registre.
[odoo_primary]
odoo1

# Conteneur PostgreSQL PRIMAIRE : la base de TOUTES les instances Odoo, la
# seule ou elles ecrivent (odoo_db_host). Aucun paquet Odoo n'y est installe.
#
# UN SEUL membre : ansi_syncro et odoo_cleanup traitent ce groupe comme
# "la" base. Les reserves sont dans db_replicas, pas ici.
[db_containers]
odoodb1 ansible_host=192.168.33.156 lxc_host=192.168.33.21

# Reserves PostgreSQL : copies en lecture seule de odoodb1, alimentees par
# replication streaming (roles/pg_server, tasks/replica.yaml). Odoo ne s'y
# connecte pas. Si odoodb1 tombe, la bascule est MANUELLE : promouvoir une
# reserve puis changer odoo_db_host. Rien ne la fait automatiquement (pas de
# Patroni).
[db_replicas]
odoodb2 ansible_host=192.168.33.157 lxc_host=192.168.33.22
odoodb3 ansible_host=192.168.33.158 lxc_host=192.168.33.23

[lxc_containers:children]
odoo_containers
db_containers
db_replicas

[lxc_containers:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
