---
# Inventaire YAML structuré pour Ansible (équivalent au précédent INI)
all:
  children:
    # Hôtes physiques (VM Gluster, Rocky 8). Chacun héberge un conteneur LXC.
    gluster_servers:
      hosts:
        192.168.36.21:
          ansible_user: root
          nic: enp5s0
        192.168.36.22:
          ansible_user: root
          nic: enp5s0
        192.168.36.23:
          ansible_user: root
          nic: enp5s0
        192.168.33.21:
          ansible_user: root
          nic: enp1s0
        192.168.33.22:
          ansible_user: root
          nic: enp1s0
        192.168.33.23:
          ansible_user: root
          nic: enp1s0

    # Hôtes porteurs d'une brick du volume GlusterFS "odoo14" (replica 3).
    gluster_bricks:
      hosts:
        192.168.36.21: {}
        192.168.36.22: {}
        192.168.36.23: {}

    # Hôte porteur des sauvegardes (rôle odoo_backup).
    backup_host:
      hosts:
        192.168.36.21: {}

    # HAProxy + keepalived sur les trois hôtes Odoo (l'ordre compte).
    lb_hosts:
      hosts:
        192.168.36.22: {}
        192.168.36.23: {}
        192.168.36.21: {}

    # Conteneurs LXC exposés directement sur le LAN (carte phys dédiée).
    odoo_containers:
      hosts:
        odoo1:
          ansible_host: 192.168.96.151
          lxc_host: 192.168.36.21
        odoo2:
          ansible_host: 192.168.96.152
          lxc_host: 192.168.36.22
        odoo3:
          ansible_host: 192.168.96.153
          lxc_host: 192.168.36.23

    # Nœud qui initialise la base et porte les tâches planifiées.
    odoo_primary:
      hosts:
        odoo1: {}

    # PostgreSQL : Patroni élit le primaire parmi les trois conteneurs.
    db_containers:
      hosts:
        odoodb1:
          ansible_host: 192.168.33.156
          lxc_host: 192.168.33.21
        odoodb2:
          ansible_host: 192.168.33.157
          lxc_host: 192.168.33.22
        odoodb3:
          ansible_host: 192.168.33.158
          lxc_host: 192.168.33.23

    db_primary:
      hosts:
        odoodb1: {}

    db_replicas:
      hosts:
        odoodb2: {}
        odoodb3: {}

    lxc_containers:
      children:
        odoo_containers: {}
        db_containers: {}
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
