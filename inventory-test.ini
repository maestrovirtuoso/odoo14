# Inventaire de test : serveur NFS (node5, exporte /backup) et client
# (monte node5:/backup sur /mnt/backup).
# Remplacer client1 et les IP par les vraies valeurs si l'exécution
# se fait par SSH plutôt qu'en local.

[servers]
node5 ansible_connection=local

[clients]
client1 ansible_connection=local

[servers:vars]
ansible_user=root

[clients:vars]
ansible_user=root
