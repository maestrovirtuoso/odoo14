<title id="title">Architecture actuelle du projet Odoo 14</title>
<desc id="desc">Trois Odoo sur 192.168.36.161 à 163 utilisent PostgreSQL primaire 192.168.33.161, qui réplique vers 192.168.33.162 et 163. Stockage GlusterFS externe 192.168.36.8:/sre et sauvegardes sur 192.168.36.21. Bascule manuelle.</desc>
