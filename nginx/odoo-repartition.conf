# ===========================================================================
# Repartiteur de charge nginx devant les trois instances Odoo 14.
#
# A deposer sur la machine PROXY (hors conteneur aujourd'hui, une VM plus
# tard -- le fichier est le meme dans les deux cas) :
#   /etc/nginx/sites-available/odoo, lie dans /etc/nginx/sites-enabled/
# Explication et mise en place : docs/NGINX-REPARTITION-CHARGE.md
#
# Les IP des instances sont RECOPIEES de inventory.yaml (odoo_containers) et
# les ports de group_vars/all/vars.yml. Si l'inventaire change, ce fichier
# doit suivre a la main : rien ne le fait automatiquement, et un backend qui
# pointe sur la mauvaise IP ne se voit pas tant qu'il repond.
# ===========================================================================

# --- Interface web : port 8069 ---------------------------------------------
upstream odoo_http {
    # hash $remote_addr et NON ip_hash : ip_hash ne retient que les trois
    # premiers octets de l'adresse. Tous les postes du lab etant dans le meme
    # /24, ils tomberaient TOUS sur le meme Odoo -- aucune repartition.
    #
    # consistent : quand un noeud sort du pool, seuls SES utilisateurs
    # changent de noeud. Les autres restent ou ils sont.
    hash $remote_addr consistent;

    # Controle de sante PASSIF : apres 3 echecs en 30 s, le noeud est ecarte
    # 30 s, puis nginx le reessaie. nginx libre n'a pas de controle actif
    # (fonction de NGINX Plus) : un Odoo qui repond 500 reste dans le pool.
    #
    # Pas de "keepalive" vers Odoo, comme dans l'exemple officiel d'Odoo :
    # chaque worker prefork traite UNE connexion a la fois, et il n'y en a
    # que 2 par noeud (odoo_workers).
    server 192.168.96.152:8069 max_fails=3 fail_timeout=30s;   # odoo1
    server 192.168.96.151:8069 max_fails=3 fail_timeout=30s;   # odoo2
    server 192.168.96.153:8069 max_fails=3 fail_timeout=30s;   # odoo3
}

# --- Bus de notifications : port 8072 --------------------------------------
# Odoo n'ouvre 8072 que si workers > 0. Y router /longpolling est ce qui fait
# fonctionner la messagerie, les compteurs et les alertes. Tout envoyer sur
# 8069 donnerait une interface qui marche sans jamais notifier : une panne
# muette.
#
# N'importe quel noeud peut servir le bus (il passe par PostgreSQL). Le meme
# hachage est garde pour qu'un utilisateur reste sur un seul noeud dans les
# journaux.
upstream odoo_longpolling {
    hash $remote_addr consistent;

    server 192.168.96.152:8072 max_fails=3 fail_timeout=30s;   # odoo1
    server 192.168.96.151:8072 max_fails=3 fail_timeout=30s;   # odoo2
    server 192.168.96.153:8072 max_fails=3 fail_timeout=30s;   # odoo3
}

server {
    # default_server : repond aussi aux requetes faites par IP. Un seul site
    # peut le revendiquer par port : si le proxy en sert deja un autre qui le
    # porte, retirer default_server ICI et mettre dans server_name le nom ou
    # l'IP que tapent les utilisateurs (cf. docs, section 4.2).
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/odoo.access.log;
    error_log  /var/log/nginx/odoo.error.log;

    # nginx refuse par defaut tout corps de plus de 1 Mo (erreur 413) : sans
    # cette ligne, la plupart des pieces jointes echoueraient.
    client_max_body_size 128m;

    # 5 s pour ETABLIR la connexion, et non les 720 s de l'exemple Odoo : un
    # noeud dont l'hote est tombe ne repond pas du tout, et c'est ce delai
    # qui decide combien de temps l'utilisateur attend avant que nginx passe
    # au noeud suivant.
    proxy_connect_timeout 5s;

    # 720 s pour LIRE et ECRIRE : le longpolling garde une requete ouverte
    # pres d'une minute en attendant un evenement, et un gros rapport PDF ou
    # un import peut durer plusieurs minutes.
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;

    # Bascule : si la connexion au noeud echoue ou expire, la requete part
    # sur le suivant. nginx ne rejoue JAMAIS un POST deja transmis a un noeud
    # (pas de double creation d'enregistrement) ; un POST dont la connexion a
    # ete refusee, lui, est bien renvoye ailleurs.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;

    # En-tetes lus par Odoo quand proxy_mode = True.
    #
    # X-Forwarded-Host est OBLIGATOIRE : Odoo 14 n'active son traitement des
    # en-tetes de proxy que s'il est present. Sans lui, proxy_mode = True ne
    # fait rien, silencieusement.
    #
    # X-Forwarded-For prend $remote_addr et ECRASE toute valeur envoyee par
    # le client : personne ne peut faire croire a Odoo qu'il vient d'ailleurs.
    #
    # $host suffit sur le port 80 ; sur un autre port, mettre $http_host,
    # sinon Odoo construit ses liens sans le port.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;

    # Noeud qui a servi la requete, visible dans les outils de developpement
    # du navigateur (onglet Reseau). Utile pour voir la repartition et la
    # bascule ; a retirer hors du lab, il revele les IP internes.
    add_header X-Odoo-Noeud $upstream_addr always;

    location /longpolling {
        proxy_pass http://odoo_longpolling;
    }

    location / {
        proxy_redirect off;
        proxy_pass http://odoo_http;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json application/javascript;
}
