[defaults]
inventory = inventory.yaml
# Les roles sont ranges par domaine sous roles/<domaine>/<role>/ (voir
# roles/README.md). Ansible ne descend pas dans les sous-dossiers de lui-meme :
# chaque domaine doit figurer ici, sinon le role est "not found". Ajouter un
# domaine => ajouter son chemin sur cette ligne.
#
# Les chemins sont resolus depuis le repertoire COURANT, pas depuis ce fichier :
# lancer ansible-playbook depuis la racine du depot.
#
# Les noms de roles restent uniques sur l'ensemble des chemins ; le premier
# chemin qui contient le nom gagne.
roles_path = ./roles/socle:./roles/lxc:./roles/odoo:./roles/exploitation
command_warnings = False

# Les hotes et conteneurs sont recrees regulierement : leur cle SSH change a
# chaque fois. Sans cela, une connexion par mot de passe (--ask-pass / sshpass)
# est refusee : "sshpass does not support host key checking".
host_key_checking = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
