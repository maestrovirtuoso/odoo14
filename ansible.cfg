[defaults]
inventory = inventory.yaml
# Un repertoire par playbook (roles/<playbook>/<role>), plus roles/commun
# pour les roles appeles par d'autres roles. Les NOMS de role ne changent pas :
# les playbooks les trouvent dans n'importe lequel de ces repertoires.
roles_path = ./roles/ansi2-snapchot:./roles/ansi_odoo:./roles/ansi_postgresql_ha:./roles/ansi_sauvegarde:./roles/ansi_syncro:./roles/commun:./roles/inutilises:./roles/nettoyage:./roles/nettoyage_odoo:./roles/reseau-lxc
command_warnings = False

# Delai de connexion SSH (10 s par defaut). Un hote qui compile des paquets
# Python (pip : lxml, Pillow...) peut mettre plus de 10 s a repondre, et
# Ansible declare alors l'hote injoignable ("timed out during banner
# exchange") alors qu'il travaille.
timeout = 60

# Les hotes et conteneurs sont recrees regulierement : leur cle SSH change a
# chaque fois. Sans cela, une connexion par mot de passe (--ask-pass / sshpass)
# est refusee : "sshpass does not support host key checking".
host_key_checking = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
pipelining = True
