---
# ===========================================================================
# Sauvegarde d'Odoo : base PARTAGEE + filestore du noeud de sauvegarde.
#
# POURQUOI LES DEUX. Depuis la bascule des pieces jointes sur disque
# (playbooks/ansi_syncro.yaml, ir_attachment.location = file), un pg_dump seul
# N'EST PLUS une sauvegarde complete : la base ne garde que les metadonnees et
# un store_fname qui designe un fichier du filestore. Restaurer la base seule
# donnerait une instance pleine de references mortes -- images cassees,
# documents introuvables -- et RIEN ne le signalerait au demarrage.
#
# PERIMETRE :
#   - la BASE est unique et partagee (prod sur 192.168.96.150). Un seul dump
#     la sauvegarde INTEGRALEMENT ;
#   - le FILESTORE est un volume GlusterFS replica 3 monte sur /mnt/odoo14,
#     commun aux trois instances. Une seule archive le capture entierement :
#     les trois briques portent le meme contenu ;
#   - les sessions sont jetables, la configuration est reproduite par ce depot.
#
# CE CONTRE QUOI CA PROTEGE. L'erreur humaine et la corruption logique : une
# suppression accidentelle, une mise a jour ratee, un document ecrase. Contre
# ces cas la replication ne peut rien -- une suppression se replique sur les
# trois briques dans la meme milliseconde. La panne d'un noeud, elle, est
# couverte par le replica 3, pas par cette sauvegarde.
#
# Lancement a la demande :
#   ansible-playbook playbooks/ansi_sauvegarde.yaml -k --ask-vault-pass
#
# Avec rapatriement HORS du cluster, avant toute operation risquee :
#   ansible-playbook playbooks/ansi_sauvegarde.yaml -k --ask-vault-pass \
#     -e sauvegarde_rapatrier=true
#
# Poser le declenchement quotidien sans sauvegarder tout de suite :
#   ansible-playbook playbooks/ansi_sauvegarde.yaml -k --ask-vault-pass \
#     --tags installer
#
# Restauration : voir docs/sauvegarde-restauration.md
# ===========================================================================

# Ce playbook n'ORCHESTRE que : chaque etape vit dans le role odoo_backup,
# sous un point d'entree distinct (tasks_from). Meme principe que
# ansi_odoo.yaml, ou aucune logique n'est ecrite dans le playbook.
#
#   tasks/main.yaml        installation : client PG, .pgpass, script, timer
#   tasks/sauvegarder.yaml lancer une sauvegarde et rendre compte
#   tasks/rapatrier.yaml   sortir une copie hors du cluster
#
# import_role et non la section "roles:" : celle-ci n'accepte pas tasks_from,
# qui est ce qui permet a un seul role d'avoir plusieurs points d'entree.

- name: "1/3 - Installer la sauvegarde et son declenchement quotidien"
  hosts: backup_host
  gather_facts: true
  tags: [installer]
  roles:
    - odoo_backup

- name: "2/3 - Sauvegarder maintenant"
  hosts: backup_host
  gather_facts: false
  tags: [sauvegarder]
  tasks:
    - name: Sauvegarder
      ansible.builtin.import_role:
        name: odoo_backup
        tasks_from: sauvegarder

- name: "3/3 - Rapatrier la sauvegarde sur le poste de controle"
  hosts: backup_host
  gather_facts: false
  tags: [rapatrier]
  tasks:
    - name: Rapatrier
      ansible.builtin.import_role:
        name: odoo_backup
        tasks_from: rapatrier
