---
# DESACTIVE PAR DEFAUT : lb_enabled=false dans group_vars/all/vars.yml.
# Sans activation explicite, le play de repartition arrete et desactive
# keepalived et HAProxy deja presents. Les sessions, tests VIP et epreuves
# de bascule sont ignores. Pour reactiver : -e lb_enabled=true.
# ===========================================================================
# Repartiteur de charge devant les trois instances Odoo 14.
#
# Une seule adresse d'entree, tenue par le noeud vivant de plus haute
# priorite, et des sessions partagees pour que la bascule ne deconnecte
# personne.
#
#            navigateur  -->  VIP 192.168.96.160:80
#                                  |
#                             keepalived   (VRRP : QUI porte la VIP)
#                                  |
#                              HAProxy     (VERS QUEL Odoo aller)
#                            /     |     \
#                       odoo1    odoo2    odoo3
#                       .151     .152     .153      :8069 web  :8072 bus
#                            \     |     /
#                     PostgreSQL unique + filestore GlusterSF partage
#
# Comme ansi_odoo.yaml, ansi_syncro.yaml et ansi_sauvegarde.yaml, ce playbook
# n'ORCHESTRE que. Toute la logique vit dans les roles :
#
#   odoo_sessions  sessions sur le volume partage (DANS les conteneurs)
#   odoo_lb        HAProxy + keepalived            (sur les HOTES)
#
# ---------------------------------------------------------------------------
# CE QUI REND LA BASCULE UTILE
#
# HAProxy seul repartit, mais ne survit pas a sa propre panne : il serait le
# point unique qu'on cherchait a supprimer. D'ou keepalived, et d'ou le fait
# que les deux tournent sur les TROIS hotes.
#
# Et une bascule ne sert a rien si l'utilisateur est deconnecte en arrivant
# ailleurs. Odoo 14 garde ses sessions dans des FICHIERS : tant qu'elles sont
# locales a chaque noeud, le second ne connait pas la session du premier. Le
# play 1 les met sur le volume Gluster deja partage. C'est la raison pour
# laquelle odoo_sessions passe AVANT odoo_lb : poser le repartiteur d'abord
# donnerait des deconnexions apparemment aleatoires.
#
# ---------------------------------------------------------------------------
# LES ADRESSES VIENNENT DE L'INVENTAIRE, jamais d'une recopie
#
# Les backends sont derives de groups['odoo_containers'] et les priorites VRRP
# de l'ordre du groupe [lb_hosts] -- meme principe que odoo_client_ips pour
# pg_hba.conf. Une IP recopiee a la main finit par designer la mauvaise
# instance, et un backend qui vise la mauvaise machine ne se signale pas : il
# repond.
#
# ---------------------------------------------------------------------------
# PREREQUIS
#   - deploiement nominal joue (playbooks/ansi_odoo.yaml) ;
#   - filestore GlusterFS monte dans les conteneurs sur /var/lib/odoo/filestore
#     (verifie par odoo_sessions, qui refuse sinon) ;
#   - proxy_mode = True et workers = 2 dans odoo.conf -- deja poses par
#     roles/odoo14/templates/odoo.conf.j2. proxy_mode fait qu'Odoo croit
#     l'en-tete X-Forwarded-For pose par HAProxy ; sans lui, toutes les
#     requetes sembleraient venir du repartiteur. workers > 0 est ce qui ouvre
#     le port 8072 du bus de notifications.
#
# EMPLOI
#   Etat des lieux SEUL, sans rien modifier :
#     ansible-playbook playbooks/ansi_repartiteur.yaml -k --ask-vault-pass --tags preflight
#
#   Sessions partagees SEULES (bref redemarrage d'Odoo) :
#     ansible-playbook playbooks/ansi_repartiteur.yaml -k --ask-vault-pass --tags sessions
#
#   Repartiteur SEUL :
#     ansible-playbook playbooks/ansi_repartiteur.yaml -k --ask-vault-pass --tags repartiteur
#
#   Verification SEULE, sans coupure :
#     ansible-playbook playbooks/ansi_repartiteur.yaml -k --ask-vault-pass --tags verif
#
#   Epreuve de bascule (coupe brievement le service, jamais jouee par defaut) :
#     ansible-playbook playbooks/ansi_repartiteur.yaml -k --ask-vault-pass --tags bascule
#
#   Tout, sauf l'epreuve de bascule :
#     ansible-playbook playbooks/ansi_repartiteur.yaml -k --ask-vault-pass
# ===========================================================================

- name: "0/4 - Preflight : la VIP est-elle libre, les instances repondent-elles ?"
  hosts: lb_hosts
  gather_facts: false
  tags: [preflight]
  tasks:
    - name: Controler la VIP et les backends
      ansible.builtin.import_role:
        name: odoo_lb
        tasks_from: preflight
      when: lb_enabled | bool

# ---------------------------------------------------------------------------
# 1/4 - Sessions partagees, AVANT le repartiteur.
#
# Bref redemarrage d'Odoo, noeud par noeud : le bind du repertoire des
# sessions n'est vu du processus qu'apres relance.
# ---------------------------------------------------------------------------
- name: "1/4 - Partager les sessions Odoo sur le volume GlusterFS"
  hosts: odoo_containers
  gather_facts: false
  tags: [sessions]
  # Un noeud a la fois : les trois instances servent la meme base, les
  # redemarrer ensemble couperait le service au lieu de le degrader.
  throttle: 1
  roles:
    - role: odoo_sessions
      when: lb_enabled | bool

# ---------------------------------------------------------------------------
# 2/4 - HAProxy et keepalived sur les trois hotes.
#
# gather_facts: true, obligatoire : keepalived.conf.j2 a besoin de
# ansible_default_ipv4 pour l'interface qui portera la VIP et pour les
# unicast_peer. Sans les faits, le template echoue sur "undefined".
# ---------------------------------------------------------------------------
- name: "2/4 - Appliquer l'etat active ou desactive du repartiteur"
  hosts: lb_hosts
  gather_facts: true
  tags: [repartiteur]
  roles:
    - odoo_lb

# ---------------------------------------------------------------------------
# 3/4 - Verification. Mesure le service, pas la configuration.
# ---------------------------------------------------------------------------
- name: "3/4 - Verifier la VIP, les backends et la session collante"
  hosts: lb_hosts
  gather_facts: false
  tags: [verif]
  tasks:
    - name: Confronter le service a ce qui est attendu
      ansible.builtin.import_role:
        name: odoo_lb
        tasks_from: verif
      when: lb_enabled | bool

# ---------------------------------------------------------------------------
# 4/4 - Epreuve de bascule, A LA DEMANDE.
#
# Tag "never" : coupe brievement le service, donc jamais jouee par un
# ansible-playbook sans tag. C'est pourtant le seul controle qui prouve la
# redondance -- une redondance jamais testee reste une hypothese.
# ---------------------------------------------------------------------------
- name: "4/4 - Eprouver la bascule de la VIP"
  hosts: lb_hosts
  gather_facts: false
  tags: [bascule, never]
  tasks:
    - name: Arreter le porteur et verifier la reprise
      ansible.builtin.import_role:
        name: odoo_lb
        tasks_from: bascule
      when: lb_enabled | bool
