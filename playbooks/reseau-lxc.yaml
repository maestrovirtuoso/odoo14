---
# ===========================================================================
# Reseau des conteneurs LXC, joue SEUL.
#
# Expose chaque conteneur directement sur le LAN en IPVLAN (mode l2,
# lxc.net.0.type = ipvlan) pose sur la carte de l'hote, puis amorce son acces
# SSH (openssh-server, python3, python3-apt, cle du poste de controle).
#
# Pourquoi ipvlan : le reseau des hotes (cloud, MTU 1442) jette les MAC
# inconnues. Un conteneur en macvlan ou en veth sur un bridge n'obtient alors
# aucune reponse de sa passerelle et n'a pas Internet. L'ipvlan partage la MAC
# de l'hote, que le reseau accepte. Valide sur 192.168.36.21 (passerelle et
# 8.8.8.8 joignables). Reste a verifier sur les hotes 192.168.33.x.
# Le choix vient de lxc_net_type dans inventory.yaml ([gluster_servers:vars]).
#
# Hotes : Debian 12. Le NAT de secours (lxc_egress_nat, eth1 sur lxcbr0) reste
# disponible dans le role mais est desactive.
#
# C'est le SEUL playbook qui joue le role lxc_lan : ansi_odoo.yaml ne le joue
# plus et suppose ce playbook deja passe. A lancer avant ansi_odoo.yaml, et
# pour rejouer l'etape reseau sans derouler tout le deploiement : apres un
# changement de mode, une reinstallation de conteneur, ou pour diagnostiquer
# un conteneur injoignable. Le role etant idempotent, le rejouer sur une
# installation saine ne change rien.
#
# PREREQUIS : les conteneurs existent deja (playbooks/ansi2-snapchot.yaml, role
# install). Ce playbook ne les cree pas.
#
# ATTENTION : le poste de controle doit avoir la MEME version du role lxc_lan
# que ce depot. Un role ancien reecrit lxc.net.0.type = macvlan et casse un
# conteneur deja passe en ipvlan. Verifier avant de lancer :
#   grep -c ipvlan roles/lxc_lan/tasks/main.yaml     # doit afficher plus de 2
#
# Lancement :
#   ansible-playbook -i inventory.yaml playbooks/reseau-lxc.yaml
#
# Voir d'abord ce qui changerait, sans rien toucher :
#   ansible-playbook -i inventory.yaml playbooks/reseau-lxc.yaml --check --diff
#
# Un seul hote :
#   ansible-playbook -i inventory.yaml playbooks/reseau-lxc.yaml --limit 192.168.36.21
#
# AVERTISSEMENT : ce playbook REDEMARRE les conteneurs (lxc-stop puis
# lxc-start). En ipvlan, l'hote ne joint pas son propre conteneur : tester
# depuis le poste de controle (ping, ssh root@<ct_ip>).
#
# Procedure manuelle equivalente : docs/BOOTSTRAP-CONTENEUR-MANUEL.md.
# ===========================================================================

- name: "Reseau : exposer les conteneurs LXC sur le LAN"
  hosts: gluster_servers
  gather_facts: true
  vars_files:
    # Fournit "containers", derive de lxc_container_name (host_vars/<ip>.yml).
    - ../common/group_vars/local_dev.yml
  roles:
    - lxc_lan
