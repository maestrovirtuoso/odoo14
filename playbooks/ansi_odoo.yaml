---
# ===========================================================================
# Deploiement d'Odoo 14 dans le conteneur LXC "devodoo14" de chaque noeud.
#
# Trois instances AUTONOMES : chacune a sa propre base PostgreSQL locale et
# son propre filestore. Aucune donnee n'est partagee entre les noeuds.
# La haute disponibilite (bascule automatique) reste a construire : voir la
# section correspondante du README.
#
# Prerequis :
#   - conteneurs deja crees (playbooks/ansi2-snapchot.yaml)
#   - authentification par CLE vers les 3 hotes gluster :
#       for h in 139 140 141; do ssh-copy-id root@192.168.96.$h; done
#   - ansible-galaxy collection install -r requirements.yml
#   - group_vars/odoo_containers/vault.yml renseigne puis chiffre
#
# Lancement :
#   ansible-playbook playbooks/ansi_odoo.yaml --ask-vault-pass
# ===========================================================================

- name: "1/2 - Reseau des hotes : bridge, routage, publication d'Odoo"
  hosts: gluster_servers
  gather_facts: true
  vars_files:
    - ../common/group_vars/local_dev.yml
  roles:
    - odoo_net

- name: "2/2 - Installation d'Odoo 14 (depot nightly) dans les conteneurs"
  hosts: odoo_containers
  gather_facts: true
  roles:
    - odoo14
