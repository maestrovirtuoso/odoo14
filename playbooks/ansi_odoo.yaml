---
# ===========================================================================
# Deploiement d'Odoo 14 sur une base PostgreSQL PARTAGEE.
#
# Architecture :
#   - un conteneur PostgreSQL primaire odoodb1 (192.168.33.161), sans Odoo,
#     et deux reserves en replication streaming (odoodb2, odoodb3) ;
#   - trois conteneurs Odoo (192.168.36.161-163) sans serveur PostgreSQL ;
#   - une base unique "prod" ;
#   - un filestore COMMUN : le volume GlusterFS replique "sre", servi par
#     192.168.36.8 hors du projet, monte par chaque conteneur Odoo lui-meme
#     sur /var/lib/odoo (playbooks/filestore-conteneur.yaml). Seul l'hote de
#     sauvegarde le garde, en lecture seule, sur /mnt/odoo ;
#   - pas de repartiteur de charge : chaque utilisateur vise une IP ;
#   - en option (pg_ha_enabled), haute disponibilite de la base : Patroni,
#     etcd et HAProxy dans les trois conteneurs PostgreSQL, Odoo passant par
#     HAProxy. Premier passage : playbooks/ansi_postgresql_ha.yaml.
#
# L'ORDRE DES PLAYS EST CONTRAIGNANT :
#   1. l'horloge : une horloge fausse fait echouer apt dans les conteneurs ;
#      puis (1bis) le filestore commun, avant qu'Odoo ne soit installe ;
#   2. la base, avant que le moindre client ne tente de s'y connecter ;
#   3. Odoo installe et configure, mais LAISSE ARRETE ;
#   4. l'initialisation du registre, par le SEUL noeud primaire ;
#   5. le demarrage des trois instances, une fois la base prete.
# Demarrer les trois instances avant l'etape 4 leur ferait ouvrir un registre
# a moitie initialise.
#
# Prerequis :
#   - conteneurs deja crees (playbooks/ansi2-snapchot.yaml)
#   - reseau des conteneurs en place et SSH amorce : lancer d'abord
#       ansible-playbook -i inventory.yaml playbooks/reseau-lxc.yaml
#     (ce playbook ne joue plus le role lxc_lan)
#   - authentification par CLE vers les 4 hotes :
#       for h in 128 129 140 141; do ssh-copy-id root@192.168.96.$h; done
#   - ansible-galaxy collection install -r requirements.yml
#   - group_vars/all/vault.yml renseigne puis chiffre
#   - le volume GlusterFS accepte les adresses des conteneurs Odoo
#     (voir playbooks/filestore-conteneur.yaml)
#
# Lancement :
#   ansible-playbook playbooks/ansi_odoo.yaml --ask-vault-pass
#
# Le controle d'environnement (play 0/5) ne tourne PLUS par defaut. Pour le
# rejouer, typiquement apres un changement d'ansible ou de collections :
#   ansible-playbook playbooks/ansi_odoo.yaml --ask-vault-pass --tags all,preflight
# ou seul, sans toucher aux hotes :
#   ansible-playbook playbooks/ansi_odoo.yaml --tags preflight
# ===========================================================================

# ---------------------------------------------------------------------------
# Controle d'environnement, avant tout contact avec les hotes.
#
# Documenter les versions dans requirements.yml ne suffit pas : rien
# n'empeche de jouer ce playbook avec un ansible ou des collections
# differents. Ce controle echoue AVANT la premiere modification, plutot que
# de laisser une incompatibilite se manifester au milieu du deploiement sous
# la forme d'un parametre inconnu ou d'un comportement change.
#
# Le tag "never" le met hors du parcours par defaut : le poste de controle
# bouge rarement, et le verifier a chaque deploiement n'apprend rien. Il faut
# desormais le demander explicitement (voir "Lancement" en tete de fichier),
# ce qui reste a faire apres toute mise a jour d'ansible ou des collections.
# ---------------------------------------------------------------------------
- name: "0/5 - Verifier l'environnement du poste de controle"
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  tags: [preflight, never]
  vars:
    # Bornes validees par le deploiement complet du 21/09/2026.
    # ansible.posix 1.1.1 declare "requires_ansible: >=2.9,<2.11" : monter
    # ansible impose donc de monter aussi les collections, et inversement.
    ansible_version_min: "2.10"
    ansible_version_max: "2.11"

  tasks:
    - name: La version d'ansible est dans la fourchette validee
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(ansible_version_min, '>=')
          - ansible_version.full is version(ansible_version_max, '<')
        fail_msg: >-
          ansible {{ ansible_version.full }} hors de la fourchette validee
          [{{ ansible_version_min }}, {{ ansible_version_max }}[.
          Les collections epinglees dans requirements.yml ne sont pas
          compatibles : ansible.posix 1.1.1 exige ansible < 2.11. Monter
          ansible impose de monter aussi requirements.yml, puis de rejouer
          un deploiement complet.
        success_msg: "ansible {{ ansible_version.full }}"

    - name: Les collections requises sont presentes aux versions attendues
      ansible.builtin.command: ansible-galaxy collection list
      register: _collections
      changed_when: false

    - name: Aucune collection requise ne manque
      ansible.builtin.assert:
        that: item.name ~ ' ' in _collections.stdout
        fail_msg: >-
          Collection {{ item.name }} absente.
          Lancer : ansible-galaxy collection install -r requirements.yml
      loop: "{{ (lookup('file', playbook_dir ~ '/../requirements.yml') | from_yaml).collections }}"
      loop_control:
        label: "{{ item.name }} {{ item.version }}"

# Le reseau des conteneurs (role lxc_lan) n'est plus joue ici : il est fait
# par playbooks/reseau-lxc.yaml, a lancer avant ce playbook.
- name: "1/5 - Hotes : horloge"
  hosts: gluster_servers
  gather_facts: true
  vars_files:
    - ../common/group_vars/local_dev.yml
  roles:
    # Une horloge fausse fait echouer apt-get update dans les conteneurs
    # ("Release file is not valid yet"), et fait arbitrer GlusterFS sur des
    # horodatages incoherents. Corriger l'heure est donc un prealable a tout
    # le reste, pas une finition.
    # Tag "horloge" : permet d'appliquer la seule correction d'horloge.
    #   ansible-playbook playbooks/ansi_odoo.yaml -k --ask-vault-pass --tags horloge
    - role: chrony
      tags: [horloge]

# 1bis/5 - Le filestore commun AVANT l'installation d'Odoo (play 3/5) : odoo14
# refuse de configurer une instance dont /var/lib/odoo n'est pas le volume
# GlusterFS, et c'est voulu -- sans lui, chaque Odoo ecrirait ses pieces
# jointes sur son disque local, sans erreur visible.
#
# Chaque conteneur Odoo monte LUI-MEME le volume sre sur /var/lib/odoo, sans
# passer par l'hote (playbooks/filestore-conteneur.yaml, trois plays). Au
# premier passage, les conteneurs Odoo redemarrent UN A LA FOIS ; ensuite,
# rien ne redemarre.
#
# Prerequis : les CONTENEURS Odoo joignent {{ gluster_server }}:24007 et les
# ports de brique du volume, qui doit accepter leurs adresses (auth.allow).
# Pour la rejouer seule :
#   ansible-playbook playbooks/ansi_odoo.yaml --ask-vault-pass --tags filestore
- import_playbook: filestore-conteneur.yaml
  tags: [filestore]

# Deux facons de servir la base, selon pg_ha_enabled (group_vars/all) :
#   false  pg_server, plays 2/5 et 2bis/5 (primaire + reserves, bascule
#          manuelle) ;
#   true   Patroni, play 2ter/5 (bascule automatique, Odoo par HAProxy).
# Jamais les deux : pg_server refuse de toucher a un serveur gere par Patroni.
- name: "2/5 - Base PostgreSQL partagee"
  hosts: db_containers
  gather_facts: true
  roles:
    - role: pg_server
      when: not (pg_ha_enabled | bool)

# Les reserves APRES le primaire, dans une play a part : leur copie initiale
# a besoin du role de replication et des slots que la play precedente vient
# de creer sur le primaire. Une play vide si db_replicas l'est.
- name: "2bis/5 - Reserves PostgreSQL (replication streaming)"
  hosts: db_replicas
  gather_facts: true
  roles:
    - role: pg_server
      when: not (pg_ha_enabled | bool)

# Les trois serveurs ENSEMBLE : etcd et la reprise par Patroni l'exigent.
# Meme play que playbooks/ansi_postgresql_ha.yaml ; sur un cluster deja sous
# Patroni, elle ne fait que verifier et remettre en conformite.
- name: "2ter/5 - Base PostgreSQL haute disponibilite (Patroni)"
  hosts: db_cluster
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: pg_ha
      when: pg_ha_enabled | bool

- name: "3/5 - Odoo 14 installe et configure (service laisse arrete)"
  hosts: odoo_containers
  gather_facts: true
  roles:
    - odoo14
    # Juste apres odoo14, qui laisse le service ARRETE (prealable d'odoo_uid) :
    # le paquet Debian cree le compte odoo avec le premier UID systeme libre,
    # qui peut differer d'un conteneur a l'autre. Sur un volume partage, ce
    # sont les NUMEROS qui comptent : sans alignement, chaque instance
    # ecrirait sous son propre UID et ne pourrait plus modifier les fichiers
    # des deux autres.
    - odoo_uid

- name: "4/5 - Initialisation de la base partagee (noeud primaire seul)"
  hosts: odoo_primary
  gather_facts: false
  # Certificat client PostgreSQL (NAT, voir odoo_db_ssl_env) : "odoo -i base"
  # et les requetes du role passent tous par libpq.
  environment: "{{ odoo_db_ssl_env }}"
  roles:
    - odoo_dbinit

- name: "5/5 - Demarrage des instances Odoo"
  hosts: odoo_containers
  gather_facts: false
  tasks:
    - name: Odoo actif et persistant
      ansible.builtin.service:
        name: odoo
        state: started
        enabled: true

    - name: Attendre que l'interface web reponde
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 8069
        timeout: 120
        delay: 5
