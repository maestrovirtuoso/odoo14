---
# Hote 192.168.36.22 - conteneur Odoo
#
# Les conteneurs sont exposes directement sur le LAN par une carte physique
# dediee (lxc.net.0.type = phys, cf. roles/lxc_lan). Il n'y a donc plus ni
# bridge lxcbr0, ni sous-reseau 10.0.x.0/24, ni routage inter-noeuds, ni
# redirection de port sur l'hote : le conteneur possede la carte et ses
# paquets ne traversent pas le pare-feu de l'hote.

# Nom du conteneur LXC construit sur cet hote. Lu par la variable
# "containers" (common/group_vars/local_dev.yml) pour les roles install et
# cleanup, et par le role lxc_lan.
lxc_container_name: devodoo14

# IP LAN du conteneur.
ct_ip: 192.168.96.152
