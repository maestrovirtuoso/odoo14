---
# Node3 - heberge le conteneur odoo3 (instance autonome)
lxcbr0_addr: 10.0.3.1
lxcbr0_cidr: 10.0.3.1/24
lxcbr0_network: 10.0.3.0/24
lxcbr0_netmask: 255.255.255.0
lxcbr0_dhcp_range: 10.0.3.2,10.0.3.254
container_ip: 10.0.3.10
container_gateway: 10.0.3.1

peer_container_routes:
  - { network: 10.0.1.0/24, via: 192.168.96.139 }
  - { network: 10.0.2.0/24, via: 192.168.96.140 }

publish_odoo_web: true
