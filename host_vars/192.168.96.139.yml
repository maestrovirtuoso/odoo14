---
# Node1 - heberge le conteneur primaire (odoo1)
lxcbr0_addr: 10.0.1.1
lxcbr0_cidr: 10.0.1.1/24
lxcbr0_network: 10.0.1.0/24
lxcbr0_netmask: 255.255.255.0
lxcbr0_dhcp_range: 10.0.1.2,10.0.1.254
container_ip: 10.0.1.10
container_gateway: 10.0.1.1

# Sous-reseaux des conteneurs des 2 autres noeuds, joignables via leur IP LAN.
peer_container_routes:
  - { network: 10.0.2.0/24, via: 192.168.96.140 }
  - { network: 10.0.3.0/24, via: 192.168.96.141 }

# Publier l'UI web du conteneur de ce noeud sur l'IP LAN de l'hote (port 8069).
publish_odoo_web: true
