---
# ===========================================================================
# Variables du repartiteur de charge.
#
# POURQUOI ICI ET NON DANS roles/odoo_lb/defaults : le preflight de
# playbooks/ansi_repartiteur.yaml les lit depuis des plays "tasks:", ou les
# defaults d'un role ne sont pas en portee. Le depot s'est deja fait prendre
# trois fois par ce piege -- voir group_vars/backup_host/vars.yml et
# group_vars/gluster_bricks/vars.yml.
# ===========================================================================

# Adresse virtuelle portee par keepalived, seule URL que les utilisateurs
# connaissent. Elle bascule automatiquement vers un autre hote si celui qui la
# porte tombe.
#
# DOIT ETRE LIBRE sur le LAN. Le preflight le verifie par un ping : une
# reponse signifie que la VIP est deja prise, et la poser creerait un conflit
# d'adresse qui casserait les deux machines.
lb_vip: 192.168.96.160
lb_vip_prefixe: 24

# Port d'ecoute du repartiteur.
lb_port: 80

# Identifiant du groupe VRRP. Doit etre UNIQUE sur le reseau : deux groupes
# portant le meme identifiant se disputent la meme VIP.
lb_vrrp_id: 51

# Page de statistiques HAProxy : etat de chaque backend, en direct.
lb_stats_uri: /haproxy-stats
lb_stats_user: admin

# Mot de passe de cette page.
#
# A DEPLACER DANS LE VAULT : ajouter vault_lb_stats_password a
# group_vars/all/vault.yml, puis rejouer. Le "default" ci-dessous n'existe que
# pour qu'un premier deploiement ne soit pas bloque.
lb_stats_password: "{{ vault_lb_stats_password | default('prosys-lab') }}"
