---
# ===========================================================================
# Variables communes a TOUS les hotes et conteneurs.
#
# Architecture : une base PostgreSQL unique, servie par un conteneur dedie,
# partagee par les instances Odoo. Ces valeurs doivent etre identiques des
# deux cotes de la connexion, d'ou leur portee "all" plutot que par groupe.
# ===========================================================================

# Haute disponibilite PostgreSQL : Patroni + etcd + HAProxy (roles/ansi_postgresql_ha/pg_ha,
# playbooks/ansi_postgresql_ha.yaml, docs/POSTGRESQL-PATRONI.md).
#
# false  la base est geree par roles/ansi_odoo/pg_server ; Odoo et les sauvegardes
#        visent odoodb1 en direct sur 5432.
# true   la base est geree par Patroni ; Odoo et les sauvegardes passent par
#        les HAProxy des trois serveurs, qui menent toujours au primaire du
#        moment. pg_server ne tourne plus.
#
# A passer a true JUSTE APRES le premier passage de ansi_postgresql_ha.yaml,
# puis rejouer ansi_odoo.yaml et ansi_sauvegarde.yaml. Une fois Patroni en
# place, pg_server refuse de toucher a la base, quelle que soit cette valeur.
pg_ha_enabled: false

# Port des HAProxy, un par serveur PostgreSQL.
pg_ha_haproxy_port: 5000

# Adresse de la base pour Odoo, les sauvegardes et les migrations.
#
# Haute disponibilite : les TROIS HAProxy, separes par des virgules, ce que
# libpq comprend nativement. Il essaie les adresses dans l'ordre et garde la
# premiere qui repond : si odoodb1 tombe avec son HAProxy, Odoo passe au
# suivant sans changer de configuration. Derive de l'inventaire.
#
# Sinon : odoodb1 (hote 192.168.33.21), en direct. Odoo (192.168.36.0/24)
# l'atteint a travers les passerelles .254 : le port 5432 doit etre ouvert
# entre les deux sous-reseaux.
odoo_db_host: >-
  {{ groups['db_cluster'] | map('extract', hostvars, 'ansible_host') | join(',')
     if pg_ha_enabled | bool else '192.168.33.161' }}
odoo_db_port: "{{ pg_ha_haproxy_port if pg_ha_enabled | bool else 5432 }}"
odoo_db_user: odoo

# Base UNIQUE partagee par toutes les instances Odoo.
# Surchargeable par l'environnement (cf. .env / .env.example).
odoo_shared_db: "{{ lookup('env', 'PROSYS_ODOO_DB') | default('prod', true) }}"

# Version PostgreSQL livree par Debian 12 bookworm.
pg_version: "15"

# Adresses autorisees a se connecter a la base, derivees de l'inventaire :
# pg_hba.conf ne peut donc pas diverger de la liste reelle des instances.
odoo_client_ips: "{{ groups['odoo_containers'] | map('extract', hostvars, 'ansible_host') | list }}"

# Hote de sauvegarde, qui se connecte a la base pour pg_dump.
#
# Il ne peut PAS etre couvert par odoo_client_ips : c'est un HOTE Rocky
# (192.168.96.128), pas un conteneur. Les conteneurs Odoo portent leurs
# propres IP LAN (.161 .162 .163) via une carte physique dediee, et l'hote qui
# heberge odoo1 est une machine distincte avec une autre adresse. Autoriser
# odoo1 n'autorise donc en rien son hote -- c'est ce qui a produit
# "no pg_hba.conf entry for host 192.168.96.128" le 2026-09-24.
#
# Les membres du groupe backup_host sont declares par leur IP dans
# l'inventaire : la liste est directement utilisable.
# Ports d'ecoute d'Odoo.
#
# 8072 est le port du LONGPOLLING, qu'Odoo n'ouvre que si workers > 0. Il
# porte le bus de notifications : messagerie instantanee, compteurs, alertes.
odoo_http_port: 8069
odoo_longpolling_port: 8072

pg_backup_client_ips: "{{ groups['backup_host'] | default([]) | list }}"

# ---------------------------------------------------------------------------
# TLS et certificats clients PostgreSQL
#
# Le routeur entre 192.168.36.0/24 (Odoo) et 192.168.33.0/24 (base) fait du
# NAT, et il n'est pas modifiable : la base voit toutes les instances sous
# l'IP de la passerelle ("no pg_hba.conf entry for host 192.168.33.254",
# 20/10/2026). L'instance est donc reconnue a son CERTIFICAT : la passerelle
# n'est admise qu'en TLS, avec mot de passe ET certificat client signe par
# l'autorite du projet. Voir roles/commun/pg_pki et pg_hba.conf.j2.
#
# Vider cette liste le jour ou le NAT est retire : les lignes /32 par
# instance reprennent alors seules le controle.
# ---------------------------------------------------------------------------
pg_nat_gateway_ips:
  - 192.168.33.254

# Autorite de certification, sur le POSTE DE CONTROLE et hors depot
# (.gitignore) : ca.key permet d'emettre des certificats que la base accepte.
# A proteger et sauvegarder comme le vault.
pg_pki_dir: "{{ inventory_dir }}/pki"
pg_pki_ca_cn: prosys-pg-ca
pg_pki_days: 3650

# Cote client, dans chaque conteneur Odoo. Surtout PAS sous /var/lib/odoo
# (home du compte odoo, donc ~/.postgresql) : c'est le volume GlusterFS
# partage, la cle d'un noeud y serait lisible des deux autres.
#
# verify-full : le client verifie aussi que le certificat du serveur porte
# l'IP visee (odoo_db_host).
odoo_db_sslmode: verify-full
odoo_db_ssl_dir: /etc/odoo/pg-ssl

# libpq n'a pas de parametre odoo.conf pour le certificat client : il le lit
# dans ces variables. Posees dans l'unite systemd, l'enveloppe odoo, et sur
# les plays Ansible qui se connectent a la base depuis un conteneur Odoo.
odoo_db_ssl_env:
  PGSSLMODE: "{{ odoo_db_sslmode }}"
  PGSSLROOTCERT: "{{ odoo_db_ssl_dir }}/root.crt"
  PGSSLCERT: "{{ odoo_db_ssl_dir }}/client.crt"
  PGSSLKEY: "{{ odoo_db_ssl_dir }}/client.key"
  # read-write : en haute disponibilite, libpq ecarte toute adresse qui le
  # menerait a un serveur en lecture seule (un HAProxy qui n'a pas encore vu
  # la bascule) et passe a la suivante. "any" (defaut de libpq) sinon.
  PGTARGETSESSIONATTRS: "{{ 'read-write' if pg_ha_enabled | bool else 'any' }}"


# Volume GlusterFS replique qui porte le filestore COMMUN aux trois Odoo.
#
# Il est servi par des serveurs GlusterFS EXTERNES au projet : aucun hote du
# depot ne porte de brique. gluster_server ne sert qu'a recuperer la
# description du volume au montage ; le client parle ensuite DIRECTEMENT a
# chaque serveur de brique du volume. Le pare-feu doit donc laisser passer,
# depuis les hotes Odoo, 24007/tcp vers gluster_server ET les ports de brique
# (49152 et suivants) vers tous les serveurs du volume
# ("gluster volume status sre" les liste).
gluster_server: 192.168.36.8
gluster_volume: sre

# Autres serveurs du volume, a qui demander sa description si gluster_server
# est injoignable au montage (option backup-volfile-servers). Vide : le
# montage depend de gluster_server seul au moment du demarrage de l'hote.
gluster_backup_servers: []

# Role PostgreSQL de la replication streaming, partage par le primaire (qui
# le cree) et les reserves (qui s'en servent) : portee "all" pour la meme
# raison que les ports ci-dessus.
pg_replication_user: replicator

# Secrets (group_vars/all/vault.yml, gitignore tant qu'il est en clair).
odoo_admin_password: "{{ vault_odoo_admin_password }}"
odoo_db_password: "{{ vault_odoo_db_password }}"
pg_replication_password: "{{ vault_pg_replication_password }}"
# Patroni (roles/ansi_postgresql_ha/pg_ha) : superutilisateur postgres (pg_rewind) et actions de
# l'API REST (bascule, configuration).
pg_ha_superuser_password: "{{ vault_pg_patroni_superuser_password }}"
pg_ha_rest_password: "{{ vault_pg_patroni_rest_password }}"
