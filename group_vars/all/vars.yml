---
# ===========================================================================
# Variables communes a TOUS les hotes et conteneurs.
#
# Architecture : une base PostgreSQL partagee, un primaire et deux replicas
# geres par Patroni et etcd. Ces valeurs doivent etre identiques des
# deux cotes de la connexion, d'ou leur portee "all" plutot que par groupe.
# ===========================================================================

# Patroni assure les elections PostgreSQL. Le mode manuel reste disponible
# explicitement avec pg_ha_enabled=false, sans executer les deux modes ensemble.
pg_ha_enabled: true

# Adresse initiale du primaire. Apres une election, modifier cette variable
# vers l'IP du nouveau primaire puis lancer playbooks/ansi_odoo_dbhost.yaml.
# Sans repartiteur, Odoo ne decouvre pas automatiquement le primaire elu.
odoo_db_host: "{{ hostvars[groups['db_primary'][0]]['ansible_host'] }}"
odoo_db_port: 5432
odoo_db_user: odoo

# Base UNIQUE partagee par toutes les instances Odoo.
# Surchargeable par l'environnement (cf. .env / .env.example).
odoo_shared_db: "{{ lookup('env', 'PROSYS_ODOO_DB') | default('prod', true) }}"

# Version PostgreSQL livree par Debian 12 bookworm.
pg_version: "15"

# Adresses autorisees a se connecter a la base, derivees de l'inventaire :
# pg_hba.conf ne peut donc pas diverger de la liste reelle des instances.
odoo_client_ips: "{{ groups['odoo_containers'] | map('extract', hostvars, 'ansible_host') | list }}"

# Ports d'ecoute d'Odoo.
#
# Portee "all" et non par groupe : ces valeurs doivent etre identiques des
# DEUX cotes -- le template odoo.conf.j2 les pose dans les conteneurs, et le
# template haproxy.cfg.j2 les vise depuis les hotes. Une divergence donnerait
# un repartiteur qui frappe un port que personne n'ecoute.
#
# 8072 est le port du LONGPOLLING, qu'Odoo n'ouvre que si workers > 0. Il
# porte le bus de notifications : messagerie instantanee, compteurs, alertes.
# Un repartiteur qui enverrait /longpolling vers 8069 donnerait une interface
# fonctionnelle mais sans aucune notification -- une panne difficile a
# diagnostiquer, parce que rien n'echoue visiblement.
odoo_http_port: 8069
odoo_longpolling_port: 8072

# Acces direct aux Odoo pour le moment. Les anciens services de repartition
# sont arretes/desactives par les playbooks lorsqu'ils existent deja.
lb_enabled: false
odoo_proxy_mode: "{{ lb_enabled | bool }}"

pg_backup_client_ips: "{{ groups['backup_host'] | default([]) | list }}"


# Secrets (group_vars/all/vault.yml, gitignore tant qu'il est en clair).
odoo_admin_password: "{{ vault_odoo_admin_password }}"
odoo_db_password: "{{ vault_odoo_db_password }}"
