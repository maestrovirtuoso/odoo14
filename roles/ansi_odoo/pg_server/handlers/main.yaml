---
# listen_addresses, port et max_connections ne sont lus qu'au demarrage :
# un rechargement ne suffit PAS, contrairement a pg_hba.conf.
- name: restart postgresql
  ansible.builtin.service:
    name: postgresql
    state: restarted

- name: reload postgresql
  ansible.builtin.service:
    name: postgresql
    state: reloaded
