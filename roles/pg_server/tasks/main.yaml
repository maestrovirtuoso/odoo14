---
# ===========================================================================
# Role pg_server  -  execute DANS les conteneurs PostgreSQL
#
#   db_containers : le PRIMAIRE, seule base servie aux instances Odoo
#                   (tasks/primary.yaml) ;
#   db_replicas   : les RESERVES, copies en lecture seule alimentees par
#                   replication streaming (tasks/replica.yaml).
# Le tronc commun (paquets, configuration, pg_hba) est ci-dessous. Le
# primaire doit etre joue AVANT les reserves : c'est lui qui cree le role
# de replication et les slots qu'elles utilisent (deux plays distinctes
# dans ansi_odoo.yaml).
#
# Ces conteneurs ne servent que la base. Aucun depot Odoo, aucun paquet
# odoo, aucun wkhtmltopdf n'y sont installes.
#
# L'ORDRE DES TACHES EST CONTRAIGNANT, voir les commentaires : la
# configuration doit etre en vigueur avant que le role SQL ne soit cree.
# ===========================================================================
- name: Afficher la cible
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_host }}) - PostgreSQL {{ pg_version }}
      {{ 'reserve de ' ~ pg_primary_host if pg_is_replica else 'primaire' }}

- name: Installer PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - "postgresql-{{ pg_version }}"
      - python3-psycopg2
    state: present

- name: Demarrer PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# ---------------------------------------------------------------------------
# Configuration du serveur
# ---------------------------------------------------------------------------
# Le fichier depose ci-dessous n'est lu que si postgresql.conf inclut conf.d.
# C'est le cas de la configuration Debian d'origine, mais un cluster edite a
# la main peut l'avoir perdu : sans ce controle le role ne ferait rien, en
# silence, et le serveur resterait sur localhost.
- name: Verifier que postgresql.conf inclut conf.d
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: "^#?\\s*include_dir\\s*="
    line: "include_dir = 'conf.d'"
    state: present
  notify: restart postgresql

# Les fichiers de certificat AVANT 10-prosys.conf, qui les designe : un
# redemarrage sur un ssl_cert_file absent laisserait le serveur arrete.
- name: TLS - certificats du serveur
  ansible.builtin.import_tasks: ssl.yaml

- name: Configurer l'ecoute reseau et l'encodage des mots de passe
  ansible.builtin.template:
    src: 10-prosys.conf.j2
    dest: "{{ pg_conf_dir }}/conf.d/10-prosys.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Configurer la replication (primaire et reserves)
  # Le premier depot sur un primaire deja en service le REDEMARRE : les Odoo
  # perdent leurs connexions quelques secondes.
  ansible.builtin.template:
    src: 20-replication.conf.j2
    dest: "{{ pg_conf_dir }}/conf.d/20-replication.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Poser les regles d'authentification
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reload postgresql

# Sans ce point de synchronisation, password_encryption ne serait pas encore
# en vigueur quand le role odoo est cree : le mot de passe serait stocke en
# md5 et rejete par un pg_hba en scram-sha-256. L'erreur se manifesterait
# cote Odoo par un echec d'authentification que l'on prendrait pour une faute
# de pg_hba, alors que la regle serait correcte.
- name: Appliquer la configuration avant de creer le role SQL
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# Ce qui differe entre primaire et reserves
# ---------------------------------------------------------------------------
- name: Primaire - role SQL, base partagee, replication sortante
  ansible.builtin.import_tasks: primary.yaml
  when: not (pg_is_replica | bool)

- name: Reserve - copie initiale et replication entrante
  ansible.builtin.import_tasks: replica.yaml
  when: pg_is_replica | bool

# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------
# pg_hba_file_rules expose les regles TELLES QUE LE SERVEUR LES A LUES : une
# faute de syntaxe y apparait en colonne "error", alors qu'un simple reload
# l'ignore en silence et laisse l'ancienne regle en vigueur.
- name: Relire les regles d'authentification appliquees
  community.postgresql.postgresql_query:
    db: postgres
    query: "SELECT line_number, database, user_name, address, auth_method, error FROM pg_hba_file_rules WHERE error IS NOT NULL"
  register: _pg_hba_errors
  become: true
  become_user: postgres
  changed_when: false

- name: Refuser un pg_hba.conf invalide
  ansible.builtin.assert:
    that: _pg_hba_errors.query_result | length == 0
    fail_msg: "pg_hba.conf comporte des regles invalides : {{ _pg_hba_errors.query_result }}"

