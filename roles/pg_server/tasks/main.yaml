---
# ===========================================================================
# Role pg_server  -  execute DANS le conteneur PostgreSQL dedie (db_containers)
#
# Ce conteneur ne sert que la base partagee par les instances Odoo. Aucun
# depot Odoo, aucun paquet odoo, aucun wkhtmltopdf n'y sont installes.
#
# L'ORDRE DES TACHES EST CONTRAIGNANT, voir les commentaires : la
# configuration doit etre en vigueur avant que le role SQL ne soit cree.
# ===========================================================================
- name: Reserver pg_server au mode de replication manuel
  ansible.builtin.assert:
    that: not (pg_ha_enabled | default(false) | bool)
    fail_msg: "Patroni gere PostgreSQL. Utiliser ansi_postgresql_ha.yaml, sans pg_server."

- name: Afficher la cible
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} ({{ ansible_host }}) - serveur PostgreSQL {{ pg_version }} partage"

- name: Installer PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - "postgresql-{{ pg_version }}"
      - python3-psycopg2
    state: present

- name: Demarrer PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Lire le mode du primaire sans modifier les donnees
  community.postgresql.postgresql_query:
    db: postgres
    query: "SELECT pg_is_in_recovery() AS in_recovery"
  register: _pg_primary_mode
  become: true
  become_user: postgres
  changed_when: false

- name: Refuser de configurer un standby comme primaire implicitement
  ansible.builtin.assert:
    that: not (_pg_primary_mode.query_result[0].in_recovery | bool)
    fail_msg: >-
      {{ inventory_hostname }} est en recovery. Choisir le primaire reel ou
      effectuer une bascule explicite avant de relancer ce role.

# ---------------------------------------------------------------------------
# Configuration du serveur
# ---------------------------------------------------------------------------
# Le fichier depose ci-dessous n'est lu que si postgresql.conf inclut conf.d.
# C'est le cas de la configuration Debian d'origine, mais un cluster edite a
# la main peut l'avoir perdu : sans ce controle le role ne ferait rien, en
# silence, et le serveur resterait sur localhost.
- name: Verifier que postgresql.conf inclut conf.d
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: "^#?\\s*include_dir\\s*="
    line: "include_dir = 'conf.d'"
    state: present
  notify: restart postgresql

- name: Configurer l'ecoute reseau et l'encodage des mots de passe
  ansible.builtin.template:
    src: 10-prosys.conf.j2
    dest: "{{ pg_conf_dir }}/conf.d/10-prosys.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Poser les regles d'authentification
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reload postgresql

# Sans ce point de synchronisation, password_encryption ne serait pas encore
# en vigueur quand le role odoo est cree : le mot de passe serait stocke en
# md5 et rejete par un pg_hba en scram-sha-256. L'erreur se manifesterait
# cote Odoo par un echec d'authentification que l'on prendrait pour une faute
# de pg_hba, alors que la regle serait correcte.
- name: Appliquer la configuration avant de creer le role SQL
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# Role SQL et base partagee
#
# Ces deux taches passent par la socket locale en authentification peer :
# elles n'ont pas besoin de login_host, et fonctionnent meme si pg_hba
# interdit tout acces reseau.
# ---------------------------------------------------------------------------
- name: Creer le role PostgreSQL odoo
  # Pas de CREATEDB ni de SUPERUSER : la base est creee par Ansible ci-dessous.
  # Aucune instance Odoo ne doit pouvoir creer ou detruire une base sur un
  # serveur qui les heberge toutes.
  # role_attr_flags est OBLIGATOIRE : sans lui le module remet les attributs
  # a leurs valeurs par defaut a chaque passage.
  community.postgresql.postgresql_user:
    name: "{{ odoo_db_user }}"
    password: "{{ odoo_db_password }}"
    role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE"
    state: present
  become: true
  become_user: postgres

- name: Creer la base partagee
  # owner est DETERMINANT en PostgreSQL 15 : un role ordinaire ne peut plus
  # creer d'objet dans le schema "public", sauf s'il possede la base (public
  # appartient alors a pg_database_owner, qui se resout a lui). Si postgres
  # possedait cette base, "odoo -i base" echouerait sur
  # "permission denied for schema public".
  community.postgresql.postgresql_db:
    name: "{{ odoo_shared_db }}"
    owner: "{{ odoo_db_user }}"
    encoding: UTF-8
    template: template0
    state: present
  become: true
  become_user: postgres

# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------
# pg_hba_file_rules expose les regles TELLES QUE LE SERVEUR LES A LUES : une
# faute de syntaxe y apparait en colonne "error", alors qu'un simple reload
# l'ignore en silence et laisse l'ancienne regle en vigueur.
- name: Relire les regles d'authentification appliquees
  community.postgresql.postgresql_query:
    db: postgres
    query: "SELECT line_number, database, user_name, address, auth_method, error FROM pg_hba_file_rules WHERE error IS NOT NULL"
  register: _pg_hba_errors
  become: true
  become_user: postgres
  changed_when: false

- name: Refuser un pg_hba.conf invalide
  ansible.builtin.assert:
    that: _pg_hba_errors.query_result | length == 0
    fail_msg: "pg_hba.conf comporte des regles invalides : {{ _pg_hba_errors.query_result }}"

- name: Confirmer l'ecoute reseau
  ansible.builtin.assert:
    that: odoo_db_host in pg_listen_addresses
    fail_msg: "pg_listen_addresses ({{ pg_listen_addresses }}) n'inclut pas {{ odoo_db_host }} : les instances Odoo ne pourront pas se connecter."
