---
lb_enabled: false

# ===========================================================================
# Valeurs par defaut du role odoo_lb.
#
# Ce role s'execute sur les HOTES Rocky 8 du groupe lb_hosts. Il pose HAProxy,
# qui repartit les requetes sur les trois Odoo, et keepalived, qui fait
# basculer la VIP si l'hote qui la porte tombe.
#
# lb_vip, lb_port, lb_vrrp_id et les identifiants de la page de statistiques
# ne sont PAS ici : ils vivent dans group_vars/lb_hosts/vars.yml, parce que le
# preflight du playbook les lit depuis une play "tasks:", ou les defaults d'un
# role ne sont pas en portee.
# ===========================================================================

# Mot de passe VRRP, echange entre les noeuds pour qu'un intrus sur le LAN ne
# puisse pas s'annoncer maitre et voler la VIP.
#
# VRRP ne le chiffre pas : il circule en clair. Il empeche l'accident, pas
# l'attaque. La vraie protection serait un VLAN dedie.
lb_vrrp_motdepasse: odoolab1

# Priorite du premier noeud du groupe lb_hosts. Les suivants descendent de
# lb_vrrp_pas a chaque rang.
#
# Le noeud vivant de plus haute priorite porte la VIP. L'ordre est celui du
# groupe [lb_hosts] dans inventory.yaml -- Ansible le preserve a l'execution,
# contrairement a "ansible-inventory --list" qui l'affiche trie.
lb_vrrp_priorite_max: 150
lb_vrrp_pas: 10

# Delais HAProxy.
#
# timeout client/server a 120 s et non les 50 s par defaut : le longpolling
# d'Odoo maintient des connexions ouvertes pres d'une minute en attendant un
# evenement. Un delai trop court les couperait en boucle, et les notifications
# ne fonctionneraient jamais.
lb_timeout_connect: 5s
lb_timeout_client: 120s
lb_timeout_server: 120s

# Controle de sante des backends.
#
# /web/login plutot qu'un simple test TCP : un Odoo dont le port est ouvert
# mais dont le registre est casse repond 500 et doit sortir du pool. Le test
# TCP le declarerait sain.
lb_check_uri: /web/login
lb_check_statut: 200

# Taille maximale d'un televersement. Odoo accepte des pieces jointes, et
# HAProxy les refuserait au-dela de cette valeur.
lb_maxconn: 2000
