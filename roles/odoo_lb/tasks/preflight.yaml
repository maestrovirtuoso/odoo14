---
# ===========================================================================
# Etat des lieux AVANT de poser le repartiteur. Ne modifie rien.
#
#   ansible-playbook playbooks/ansi_repartiteur.yaml -k --tags preflight
# ===========================================================================

- name: Relever l'interface qui porte la route par defaut
  ansible.builtin.setup:
    gather_subset: [network]

- name: Afficher l'interface retenue pour la VIP
  # La VIP se pose sur l'interface de la ROUTE PAR DEFAUT de l'hote, et non
  # sur ens224 : celle-la est donnee au conteneur (lxc.net.0.type = phys) et
  # n'existe plus cote hote. keepalived accepterait la configuration et
  # echouerait a l'execution.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} : interface {{ ansible_default_ipv4.interface }}
      ({{ ansible_default_ipv4.address }}),
      priorite VRRP {{ lb_vrrp_priorite_max - (groups['lb_hosts'].index(inventory_hostname) * lb_vrrp_pas) }}

- name: La VIP est-elle deja prise sur le LAN ?
  # run_once : un seul hote suffit a tester, et trois ping simultanes sur la
  # meme adresse ne disent rien de plus.
  #
  # Une reponse ICI signifie qu'une AUTRE machine porte deja
  # {{ lb_vip }} -- keepalived la revendiquerait aussi, et deux machines avec
  # la meme adresse rendent le service intermittent, jamais franchement mort.
  # Le choix de l'adresse doit alors etre revu avant de continuer.
  ansible.builtin.command: "ping -c 2 -W 1 {{ lb_vip }}"
  register: _lb_ping_vip
  changed_when: false
  failed_when: false
  run_once: true

- name: L'etat de keepalived, pour savoir si cette reponse vient de nous
  ansible.builtin.command: systemctl is-active keepalived
  register: _lb_keepalived_actif
  changed_when: false
  failed_when: false

- name: Refuser une VIP portee par une machine tierce
  ansible.builtin.assert:
    that:
      - _lb_ping_vip.rc != 0 or (_lb_keepalived_actif.stdout | trim == 'active')
    fail_msg: >-
      {{ lb_vip }} repond deja alors que keepalived n'est actif sur aucun hote
      du groupe lb_hosts. Une autre machine porte cette adresse. Choisir une
      VIP libre dans group_vars/lb_hosts/vars.yml avant de rejouer.
    success_msg: >-
      {{ lb_vip }} est {{ 'deja portee par notre keepalived' if _lb_ping_vip.rc == 0 else 'libre' }}.
    quiet: true
  run_once: true

- name: Les instances Odoo repondent-elles sur leurs deux ports ?
  # Teste DEPUIS l'hote du repartiteur, et non depuis le poste de travail :
  # c'est ce chemin-la qu'emprunteront les requetes. Un port joignable
  # d'ailleurs ne prouve rien sur celui-ci.
  #
  # 8072 compte autant que 8069 : Odoo ne l'ouvre que si workers > 0. Absent,
  # l'interface fonctionnerait et aucune notification n'arriverait jamais.
  ansible.builtin.wait_for:
    host: "{{ hostvars[item.0].ansible_host }}"
    port: "{{ item.1 }}"
    timeout: 5
  loop: "{{ groups['odoo_containers'] | product([odoo_http_port, odoo_longpolling_port]) | list }}"
  register: _lb_backends
  # ignore_errors et NON failed_when: false.
  #
  # failed_when: false REECRIT le champ "failed" de chaque element a False.
  # Le bilan ci-dessous, qui filtre sur ce champ, ne trouvait donc jamais
  # personne : le 30/09/2026 il a affiche "injoignables: []" alors que les
  # trois Odoo etaient ARRETES et que rien n'ecoutait sur 8069 ni 8072.
  # ignore_errors laisse "failed" dire la verite tout en poursuivant la play.
  #
  # Encore un indicateur qui ne mesurait pas ce qu'on croyait -- comme
  # "lxc-attach renvoie 0" ou "RESTANT=0".
  ignore_errors: true
  run_once: true

- name: Bilan des backends
  # Liste les couples hote/port qui n'ont PAS repondu. Une liste vide est la
  # bonne nouvelle ; ce qui est nomme ici est ce qu'il faut aller regarder.
  ansible.builtin.debug:
    msg:
      injoignables: >-
        {{ _lb_backends.results | selectattr('failed')
           | map(attribute='item') | map('join', ':') | list }}
  run_once: true

- name: Refuser de poser un repartiteur sans backend joignable
  # Un seul port manquant n'est pas bloquant -- le repartiteur existe
  # precisement pour survivre a un noeud absent. Zero backend joignable, si.
  ansible.builtin.assert:
    that:
      - _lb_backends.results | rejectattr('failed') | list | length > 0
    fail_msg: >-
      Aucune instance Odoo ne repond depuis {{ inventory_hostname }}.
      Verifier les conteneurs avant de poser le repartiteur.
    quiet: true
  run_once: true
