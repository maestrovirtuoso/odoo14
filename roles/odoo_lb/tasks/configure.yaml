---
# ===========================================================================
# Role odoo_lb active - execute sur les HOTES Rocky 8 du groupe lb_hosts
#
#            client  -->  VIP {{ lb_vip }}:{{ lb_port }}
#                              |
#                         keepalived  (VRRP : qui porte la VIP)
#                              |
#                          HAProxy    (vers quel Odoo aller)
#                        /     |     \
#                   odoo1    odoo2    odoo3      :8069  interface web
#                                                :8072  longpolling
#
# Les deux services sont sur les TROIS hotes, et non sur un seul : un
# repartiteur unique serait le point de panne qu'on cherchait a supprimer.
# Un seul porte la VIP a la fois, les autres attendent.
# ===========================================================================

- name: Installer HAProxy, keepalived et socat
  # socat n'est pas decoratif : c'est lui qui interroge la socket
  # d'administration de HAProxy dans tasks/verif.yaml. Sans lui, la seule
  # source qui donne l'etat REEL des backends est hors de portee.
  ansible.builtin.dnf:
    name:
      - haproxy
      - keepalived
      - socat
    state: present

# --- Pouvoir ecouter sur une VIP qu'on ne porte pas -------------------------
- name: Autoriser la liaison sur une adresse non locale
  # SANS CECI, HAProxy ne demarre PAS sur les deux hotes de secours : il veut
  # ecouter sur {{ lb_vip }}, que seul le maitre porte, et le bind echoue avec
  # "cannot bind socket". Le service resterait mort jusqu'a une bascule, donc
  # exactement quand on a besoin de lui.
  #
  # sysctl_file plutot que /etc/sysctl.conf : un fichier par sujet dans
  # sysctl.d, comme le fait deja le role lxc_lan pour le routage.
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/99-odoo-lb.conf
    sysctl_set: true
    state: present
    reload: true

# --- SELinux ---------------------------------------------------------------
- name: Relever l'etat de SELinux
  ansible.builtin.command: getenforce
  register: _lb_selinux
  changed_when: false
  failed_when: false

- name: Autoriser HAProxy a joindre les ports d'Odoo
  # SELinux confine HAProxy a une liste de ports "http". 8069 et 8072 n'y sont
  # pas : sans ce booleen, tous les backends apparaissent DOWN alors qu'Odoo
  # repond parfaitement en direct. Le journal ne dit rien d'utile, la trace est
  # dans l'audit SELinux -- panne couteuse a diagnostiquer.
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: _lb_selinux.stdout | default('Disabled') != 'Disabled'

# --- Pare-feu --------------------------------------------------------------
- name: Le pare-feu est-il actif ?
  ansible.builtin.command: systemctl is-active firewalld
  register: _lb_firewalld
  changed_when: false
  failed_when: false

- name: Ouvrir le port du repartiteur
  ansible.posix.firewalld:
    port: "{{ lb_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: _lb_firewalld.stdout | trim == 'active'

- name: Laisser passer les annonces VRRP entre les noeuds
  # VRRP n'est ni TCP ni UDP : c'est le protocole IP 112. Il ne s'ouvre donc
  # pas avec "port:". Bloque, chaque noeud se croit seul survivant et prend la
  # VIP : trois machines avec la MEME adresse sur le LAN, ce qui casse le
  # service au lieu de le rendre redondant (split-brain VRRP).
  ansible.posix.firewalld:
    rich_rule: "rule protocol value=\"vrrp\" accept"
    permanent: true
    immediate: true
    state: enabled
  when: _lb_firewalld.stdout | trim == 'active'

# --- HAProxy ---------------------------------------------------------------
- name: Deposer la configuration HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0640"
    # Valide la syntaxe AVANT d'ecrire. Une configuration fautive deposee puis
    # rechargee laisse HAProxy mort et l'entree unique du service avec lui.
    # %s est le fichier temporaire, jamais la destination.
    validate: haproxy -c -f %s
  notify: redemarrer haproxy

- name: Activer HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started

# --- keepalived ------------------------------------------------------------
- name: Deposer la configuration keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
  notify: redemarrer keepalived

- name: Activer keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started

# Appliquer maintenant : les verifications qui suivent dans le playbook
# interrogent la VIP, qui n'existerait pas encore si les handlers attendaient
# la fin de la play.
- name: Appliquer les redemarrages en attente
  ansible.builtin.meta: flush_handlers
