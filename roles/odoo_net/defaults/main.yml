---
# Nom du conteneur LXC deploye par le role "install".
lxc_container_name: devodoo14

# Interface bridge interne LXC.
lxc_bridge: lxcbr0

# Cle publique du poste de controle a injecter dans le conteneur pour
# qu'Ansible puisse ensuite l'atteindre en SSH (via ProxyCommand sur l'hote).
# Surchargeable : -e controller_ssh_pubkey="ssh-ed25519 AAAA..."
controller_ssh_pubkey: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub', errors='warn') | default('', true) }}"

# Port web Odoo publie depuis l'hote (si publish_odoo_web est vrai).
odoo_web_port: 8069
