---
# Annule ce que le role "install" a fait sur les VM.
# Option : passer  -e remove_epel=true  pour desinstaller aussi epel-release.

- name: Detruire les conteneurs LXC
  ansible.builtin.command: "lxc-destroy --force --name {{ item.name }}"
  loop: "{{ containers }}"
  register: _destroy
  changed_when: _destroy.rc == 0
  failed_when: false

- name: Arreter et desactiver les services LXC
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - lxc
    - lxc-net
  failed_when: false

# On utilise ansible.builtin.dnf plutot que le module generique "package" :
# lui seul expose lock_timeout. Sans cela, si le timer dnf-makecache tient le
# verrou RPM, la tache attend indefiniment au lieu d'echouer.
- name: Supprimer les paquets LXC (Rocky / RHEL)
  ansible.builtin.dnf:
    name:
      - lxc
      - lxc-templates
      - python3-lxc
      - bridge-utils
    state: absent
    lock_timeout: "{{ dnf_lock_timeout }}"
  when: ansible_os_family in ["RedHat", "Rocky", ]

- name: Supprimer les paquets LXC (Debian / Ubuntu)
  ansible.builtin.apt:
    name:
      - lxc
      - lxc-templates
      - python3-lxc
      - bridge-utils
    state: absent
    purge: true
  when: ansible_os_family == "Debian"



- name: Supprimer les repertoires et fichiers crees pour LXC
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/lxc
    - /var/cache/lxc
    - /var/log/lxc
    - /etc/lxc
    - /etc/sysconfig/lxc-net

- name: Supprimer le depot EPEL (seulement si -e remove_epel=true)
  ansible.builtin.dnf:
    name: epel-release
    state: absent
    lock_timeout: "{{ dnf_lock_timeout }}"
  when:
    - remove_epel is defined and remove_epel
    - ansible_os_family in ["RedHat", "Rocky", ]

- name: Remettre SELINUX=enforcing dans la config
  ansible.builtin.replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=permissive'
    replace: 'SELINUX=enforcing'
  when: ansible_os_family in ["RedHat", "Rocky", ]

- name: Reactiver SELinux immediatement
  ansible.builtin.command: setenforce 1
  changed_when: true
  failed_when: false
  when: ansible_os_family in ["RedHat", "Rocky",]
