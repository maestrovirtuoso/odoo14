---
# ---------------------------------------------------------------------------
# Sources APT pour Debian 12 (bookworm), toujours pleinement maintenue.
#
# Les contorsions heritees de Debian 11 n'ont plus lieu d'etre : le depot de
# securite bookworm-security existe et est servi, les fichiers Release sont
# valides, et main/updates/security forment un jeu coherent. Plus besoin ni de
# "Acquire::Check-Valid-Until false", ni de bascule vers archive.debian.org.
#
# Les etapes de reparation qui suivent (paquets en etat incoherent,
# realignement de versions) sont conservees comme filet de securite : sur un
# conteneur bookworm neuf elles ne trouvent rien a corriger.
# ---------------------------------------------------------------------------

- name: Supprimer le contournement de date herite de Debian 11
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99-ignore-valid-until
    state: absent

- name: Ecrire des sources APT coherentes
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    mode: "0644"
    content: |
      deb {{ debian_mirror }} bookworm main contrib non-free non-free-firmware
      deb {{ debian_mirror }} bookworm-updates main contrib non-free non-free-firmware
      deb {{ debian_security_mirror }} bookworm-security main contrib non-free non-free-firmware

- name: Rafraichir le cache apt
  ansible.builtin.command: apt-get update
  changed_when: true

# ---------------------------------------------------------------------------
# Reparation de l'etat dpkg herite des lancements precedents
# ---------------------------------------------------------------------------
- name: Reparer les paquets laisses en etat incoherent
  ansible.builtin.shell: |
    set -u
    # Un paquet sain a le statut "install ok installed" ; tout autre etat
    # (half-configured, reinstreq...) bloque toute operation apt ulterieure.
    broken=$(dpkg-query -W -f='${Package} ${Status}\n' 2>/dev/null \
             | awk '$4 != "installed" {print $1}')
    if [ -z "$broken" ]; then
      echo "aucun paquet casse"
      exit 0
    fi
    echo "paquets casses:$(echo $broken | tr '\n' ' ')"
    # D'abord la reinstallation propre.
    if apt-get install -y --reinstall $broken; then
      echo "reinstallation reussie"
    else
      # Sinon suppression forcee : ces paquets sont des orphelins de l'image
      # (dependances ModemManager & co, inutiles en conteneur).
      echo "reinstallation impossible, suppression forcee"
      dpkg --remove --force-remove-reinstreq $broken || true
    fi
    dpkg --configure -a || true
    apt-get -y --fix-broken install || true
  register: _apt_repair
  changed_when: "'aucun paquet casse' not in _apt_repair.stdout"

# ---------------------------------------------------------------------------
# Realignement des versions sur les depots restants
#
# Codee en dur sur quelques paquets, cette etape ratait tous les autres :
# apres gnupg/gpgv c'est perl/perl-base qui bloquait. Le script traite
# desormais TOUT paquet installe en version superieure a la candidate, et
# les retrograde en UNE SEULE transaction apt (indispensable : les paquets
# lies par une dependance stricte doivent bouger ensemble).
# ---------------------------------------------------------------------------
- name: Deposer l'outil de realignement APT
  ansible.builtin.copy:
    src: apt-realign
    dest: /usr/local/sbin/apt-realign
    mode: "0755"

- name: Realigner les paquets sur les versions offertes par les depots
  ansible.builtin.command: /usr/local/sbin/apt-realign
  register: _apt_realign
  changed_when: "'retrogradation de' in _apt_realign.stdout"

- name: Afficher le realignement effectue
  ansible.builtin.debug:
    var: _apt_realign.stdout_lines

- name: Finaliser les dependances apres realignement
  ansible.builtin.shell: |
    dpkg --configure -a || true
    apt-get -y --fix-broken install || true
  register: _apt_settle
  changed_when: false

# Simule l'installation de TOUT ce que le role va reellement demander :
# le blocage se revele ici, avant d'avoir modifie quoi que ce soit.
- name: Validation finale de la coherence APT
  ansible.builtin.shell: >-
    apt-get -s install -y {{ apt_validate_packages | join(' ') }}
  register: _apt_final
  changed_when: false
  failed_when: _apt_final.rc != 0
  when: apt_validate_packages | length > 0
