---
# ===========================================================================
# Role lxc_lan  -  execute sur les HOTES (gluster_servers, Rocky 8)
#
# Expose le conteneur LXC directement sur le LAN, selon lxc_net_type :
#   - phys    : le conteneur recoit une CARTE PHYSIQUE dediee. Il possede
#               alors la carte : elle disparait de l'hote ;
#   - macvlan : le conteneur recoit une interface virtuelle posee sur la
#               carte de l'hote, qui la garde. Seul choix possible quand
#               l'hote n'a qu'une carte sur ce reseau ; l'hote ne joint
#               alors pas son propre conteneur.
# Dans les deux cas, les paquets du conteneur ne traversent jamais le
# netfilter de l'hote.
#
# Consequence a garder en tete : aucune regle de pare-feu de l'hote ne
# protege ni n'expose le conteneur. Le controle d'acces se fait dans le
# conteneur (pour la base : listen_addresses et pg_hba.conf, voir
# roles/pg_server).
#
# Ce role remplace odoo_net, dont la moitie du contenu (bridge lxcbr0,
# ip_forward, routes inter-noeuds, masquerade, redirection de port) n'a plus
# d'objet. Ce qui est conserve d'odoo_net : le demarrage avec diagnostic,
# l'attente d'IP et l'amorcage SSH.
#
# PIEGE LXC 3.0.4 : lxc-attach renvoie TOUJOURS 0, quoi qu'il arrive. Toute
# verification faite dans le conteneur est donc validee sur un MARQUEUR
# imprime sur stdout (IP_OK, BOOTSTRAP_SSH_OK), jamais sur .rc.
# ===========================================================================

# ---------------------------------------------------------------------------
# 0. Garde-fous
# ---------------------------------------------------------------------------
# Tous passent AVANT la moindre modification : un reseau mal decrit coupe le
# conteneur, voire l'hote, et Ansible perd alors le moyen de revenir en
# arriere.
- name: Le mode reseau et l'adressage du conteneur sont decrits
  ansible.builtin.assert:
    that:
      - lxc_net_type in ['phys', 'macvlan']
      - ct_ip is defined
      - ct_ip | length > 0
      - ct_prefix | int > 0
      - ct_prefix | int <= 32
    fail_msg: >-
      lxc_net_type doit valoir phys ou macvlan (valeur : {{ lxc_net_type }}),
      et ct_ip / ct_prefix doivent etre renseignes dans
      host_vars/{{ inventory_hostname }}.yml.

# Une passerelle hors du sous-reseau du conteneur laisse celui-ci sans route
# par defaut : il demarre, mais ne joint ni les depots apt ni le poste de
# controle. Le defaut (passerelle de l'hote) tombe dans ce cas des que l'hote
# et son conteneur sont sur des sous-reseaux differents.
# Calcul fait sur le poste de controle : son python est garanti, celui de
# l'hote ne l'est pas, et ansible 2.10 n'a pas de filtre ipaddr sans netaddr.
- name: La passerelle est dans le sous-reseau du conteneur
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - |
        import ipaddress, sys
        reseau = ipaddress.ip_interface(sys.argv[1]).network
        if ipaddress.ip_address(sys.argv[2]) not in reseau:
            sys.exit('Passerelle %s hors du reseau %s : definir ct_gateway dans host_vars.'
                     % (sys.argv[2], reseau))
      - "{{ ct_ip }}/{{ ct_prefix }}"
      - "{{ ct_gateway }}"
  delegate_to: localhost
  become: false
  changed_when: false

# En mode phys, donner au conteneur la carte qui porte la route par defaut
# couperait l'hote definitivement. En macvlan l'hote garde sa carte : le
# controle n'a plus d'objet, et c'est justement le cas d'usage du macvlan.
- name: Refuser de deporter la carte qui porte la route par defaut
  ansible.builtin.assert:
    that: ansible_default_ipv4.interface != nic
    fail_msg: >-
      {{ nic }} porte la route par defaut de {{ inventory_hostname }} :
      la donner au conteneur couperait l'hote, sans retour possible.
      Choisir une autre carte (variable "nic"), ou passer
      lxc_net_type a macvlan.
  when: lxc_net_type == 'phys'

- name: Verifier la presence de la carte (sur l'hote ou deja dans le conteneur)
  ansible.builtin.shell: >-
    ip link show {{ nic }}
    || grep -q '^lxc.net.0.link = {{ nic }}' /var/lib/lxc/{{ lxc_container_name }}/config
  changed_when: false

- name: Demonter l'ancien modele reseau routé
  ansible.builtin.import_tasks: undo_routed.yaml
  when: lxc_undo_routed | bool

# ---------------------------------------------------------------------------
# 1. Configuration de l'interface du conteneur
# ---------------------------------------------------------------------------
- name: NetworkManager ignore la carte dediee (mode phys seulement)
  # Sans cela NetworkManager la reclame au demarrage de l'hote, avant que LXC
  # ne la prenne, et le conteneur ne demarre pas.
  # JAMAIS en macvlan : la carte y reste celle de l'hote, et la retirer a
  # NetworkManager lui ferait perdre son adresse au prochain redemarrage.
  when: lxc_net_type == 'phys'
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/lxc-unmanaged.conf
    content: "[keyfile]\nunmanaged-devices=interface-name:{{ nic }}\n"
    mode: "0644"
  notify: reload NetworkManager

- name: Appliquer la configuration NetworkManager avant de toucher au conteneur
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# 1b. Sortie Internet par NAT via l'hote (lxc_egress_nat)
#
# Quand le reseau du LAN filtre la MAC/IP du macvlan (cloud avec port
# security), le conteneur ne joint meme pas sa passerelle. On lui ajoute une
# 2e interface (eth1) sur lxcbr0, derriere l'IP de l'hote, que le reseau
# connait : apt et le reste du trafic sortant passent par la. eth0 (macvlan)
# garde l'identite LAN du conteneur.
# ---------------------------------------------------------------------------
- name: Activer le routage IPv4 sur l'hote (sortie NAT du conteneur)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: lxc_egress_nat | bool

- name: Demarrer le bridge {{ lxc_egress_bridge }} (lxc-net)
  ansible.builtin.systemd:
    name: lxc-net
    state: started
    enabled: true
  when: lxc_egress_nat | bool

- name: Masquerade firewalld sur la zone de sortie de l'hote
  ansible.posix.firewalld:
    zone: public
    masquerade: true
    permanent: true
    immediate: true
    state: enabled
  when: lxc_egress_nat | bool

- name: Laisser passer le trafic du bridge {{ lxc_egress_bridge }} (zone trusted)
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ lxc_egress_bridge }}"
    permanent: true
    immediate: true
    state: enabled
  when: lxc_egress_nat | bool

- name: Sauvegarder la configuration LXC d'origine (une seule fois)
  ansible.builtin.copy:
    src: "/var/lib/lxc/{{ lxc_container_name }}/config"
    dest: "/var/lib/lxc/{{ lxc_container_name }}/config.orig"
    remote_src: true
    force: false
    mode: "0644"

- name: Supprimer l'adresse MAC figee et le hook ipvlan
  # Une hwaddr heritee du mode veth n'a pas de sens sur une carte physique.
  # En macvlan, LXC en tire une au hasard : une MAC figee copiee d'un autre
  # conteneur (clonage) creerait un doublon sur le LAN.
  ansible.builtin.lineinfile:
    path: "/var/lib/lxc/{{ lxc_container_name }}/config"
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^lxc\.net\.0\.hwaddr'
    - '^lxc\.hook\.pre-start.*ipvlan'

- name: Retirer le mode macvlan d'une configuration repassee en phys
  ansible.builtin.lineinfile:
    path: "/var/lib/lxc/{{ lxc_container_name }}/config"
    regexp: '^lxc\.net\.0\.macvlan\.'
    state: absent
  when: lxc_net_type == 'phys'

- name: Configurer l'interface reseau du conteneur ({{ lxc_net_type }})
  ansible.builtin.lineinfile:
    path: "/var/lib/lxc/{{ lxc_container_name }}/config"
    regexp: '^lxc\.net\.0\.{{ item.k | regex_escape }}\s*='
    line: "lxc.net.0.{{ item.k }} = {{ item.v }}"
  loop: >-
    {{ [
         {'k': 'type', 'v': lxc_net_type},
         {'k': 'link', 'v': nic},
         {'k': 'name', 'v': 'eth0'},
         {'k': 'flags', 'v': 'up'},
         {'k': 'ipv4.address', 'v': ct_ip ~ '/' ~ ct_prefix}
       ]
       + ([] if lxc_egress_nat | bool else
          [{'k': 'ipv4.gateway', 'v': ct_gateway}])
       + ([{'k': 'macvlan.mode', 'v': lxc_macvlan_mode}]
          if lxc_net_type == 'macvlan' else []) }}

# Avec la sortie NAT, la passerelle par defaut est celle de eth1 : eth0 n'en
# porte plus (la passerelle LAN ne repond pas a la MAC du macvlan).
- name: Retirer la passerelle LXC de eth0 (sortie NAT)
  ansible.builtin.lineinfile:
    path: "/var/lib/lxc/{{ lxc_container_name }}/config"
    regexp: '^lxc\.net\.0\.ipv4\.gateway'
    state: absent
  when: lxc_egress_nat | bool

- name: Interface de sortie NAT du conteneur (eth1 sur {{ lxc_egress_bridge }})
  ansible.builtin.lineinfile:
    path: "/var/lib/lxc/{{ lxc_container_name }}/config"
    regexp: '^lxc\.net\.1\.{{ item.k | regex_escape }}\s*='
    line: "lxc.net.1.{{ item.k }} = {{ item.v }}"
  loop:
    - {k: type, v: veth}
    - {k: link, v: "{{ lxc_egress_bridge }}"}
    - {k: name, v: eth1}
    - {k: flags, v: up}
    - {k: ipv4.address, v: "{{ lxc_egress_ip }}/{{ lxc_egress_prefix }}"}
    - {k: ipv4.gateway, v: "{{ lxc_egress_gateway }}"}
  when: lxc_egress_nat | bool

- name: Retirer eth1 si la sortie NAT est desactivee
  ansible.builtin.lineinfile:
    path: "/var/lib/lxc/{{ lxc_container_name }}/config"
    regexp: '^lxc\.net\.1\.'
    state: absent
  when: not (lxc_egress_nat | bool)

- name: IP statique dans le conteneur (systemd-networkd, sans DHCP)
  ansible.builtin.copy:
    dest: "/var/lib/lxc/{{ lxc_container_name }}/rootfs/etc/systemd/network/eth0.network"
    mode: "0644"
    content: |
      [Match]
      Name=eth0

      [Network]
      Address={{ ct_ip }}/{{ ct_prefix }}
      {% if not (lxc_egress_nat | bool) %}
      Gateway={{ ct_gateway }}
      {% endif %}
      {% for dns in ct_dns_servers %}
      DNS={{ dns }}
      {% endfor %}

- name: IP statique de la sortie NAT dans le conteneur (eth1)
  ansible.builtin.copy:
    dest: "/var/lib/lxc/{{ lxc_container_name }}/rootfs/etc/systemd/network/eth1.network"
    mode: "0644"
    content: |
      [Match]
      Name=eth1

      [Network]
      Address={{ lxc_egress_ip }}/{{ lxc_egress_prefix }}
      Gateway={{ lxc_egress_gateway }}
      {% for dns in ct_dns_servers %}
      DNS={{ dns }}
      {% endfor %}
  when: lxc_egress_nat | bool

- name: Pas de eth1.network si la sortie NAT est desactivee
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ lxc_container_name }}/rootfs/etc/systemd/network/eth1.network"
    state: absent
  when: not (lxc_egress_nat | bool)

# ---------------------------------------------------------------------------
# 2. Demarrage du conteneur
# ---------------------------------------------------------------------------
- name: Arreter le conteneur avant reconfiguration reseau
  ansible.builtin.command: "lxc-stop -n {{ lxc_container_name }}"
  register: _lxc_stop
  changed_when: _lxc_stop.rc == 0
  failed_when: false

- name: (Re)demarrer le conteneur et confirmer l'etat RUNNING
  block:
    - name: (Re)demarrer le conteneur
      ansible.builtin.command: "lxc-start -n {{ lxc_container_name }} -d"
      register: _lxc_start
      changed_when: _lxc_start.rc == 0
      failed_when: false

    - name: Attendre que le conteneur ait un PID actif
      ansible.builtin.command: "lxc-info -n {{ lxc_container_name }} -sH"
      register: _lxc_state
      until: _lxc_state.stdout | trim == "RUNNING"
      retries: 100
      delay: 2
      changed_when: false
  rescue:
    - name: Recuperer le log du conteneur
      ansible.builtin.command: "tail -n 80 /var/log/lxc/{{ lxc_container_name }}.log"
      register: _lxc_log
      changed_when: false
      failed_when: false

    - name: Afficher la config et le log du conteneur
      ansible.builtin.debug:
        msg: "{{ _lxc_log.stdout_lines | default(['(log absent)']) }}"

    - name: Relayer l'echec de demarrage
      ansible.builtin.fail:
        msg: >-
          Le conteneur {{ lxc_container_name }} ne demarre pas sur
          {{ inventory_hostname }}. Voir le log ci-dessus. Verifier
          /var/lib/lxc/{{ lxc_container_name }}/config (lxc.net.0.*),
          l'espace disque, et 'systemctl status lxc-net'.


# ---------------------------------------------------------------------------
# 3. Attente de l'adresse dans le conteneur
# ---------------------------------------------------------------------------
- name: Attendre que systemd-networkd du conteneur configure eth0
  ansible.builtin.command:
    argv:
      - lxc-attach
      - -n
      - "{{ lxc_container_name }}"
      - --
      - /bin/bash
      - -c
      - |
        for i in $(seq 1 30); do
          if ip -4 addr show eth0 2>/dev/null | grep -q '{{ ct_ip }}'; then
            echo IP_OK; exit 0
          fi
          sleep 1
        done
        echo IP_KO
        ip -4 addr show eth0 2>&1 || true
  register: _ctr_ip
  changed_when: false
  # lxc-attach perd le code retour : on valide sur le marqueur.
  failed_when: "'IP_OK' not in _ctr_ip.stdout"


# ---------------------------------------------------------------------------
# 4. Amorcage de l'acces SSH dans le conteneur (via lxc-attach)
# ---------------------------------------------------------------------------
- name: Verifier qu'une cle publique de controleur est disponible
  ansible.builtin.assert:
    that: controller_ssh_pubkey | length > 0
    fail_msg: >-
      Aucune cle SSH sur le poste de controle. Fais 'ssh-keygen' puis relance,
      ou passe -e controller_ssh_pubkey="ssh-ed25519 AAAA...".

- name: Installer openssh-server + cle du controleur dans le conteneur
  ansible.builtin.command:
    argv:
      - timeout
      - "600"
      - lxc-attach
      - -n
      - "{{ lxc_container_name }}"
      - --
      - /bin/bash
      - -c
      - |
        # Pas de "set -e" : on veut derouler jusqu'au bout et TOUT tracer sur
        # stdout, seule voie de retour fiable (lxc-attach perd le code retour).
        exec 2>&1
        export DEBIAN_FRONTEND=noninteractive

        # Debian 12 (bookworm) est pleinement maintenue : main, updates et
        # security sont servis et coherents entre eux. Le contournement de
        # date herite de Debian 11 est retire s'il traine encore.
        rm -f /etc/apt/apt.conf.d/99-ignore-valid-until

        # Seul "main" est utile ici (openssh-server, python3, python3-apt) :
        # contrib/non-free alourdissent les index sans rien apporter.
        {
          printf 'deb http://deb.debian.org/debian bookworm main\n'
          printf 'deb http://deb.debian.org/debian bookworm-updates main\n'
          printf 'deb http://security.debian.org/debian-security bookworm-security main\n'
        } > /etc/apt/sources.list

        # Ni traductions des index, ni mise a jour inutile.
        printf 'Acquire::Languages "none";\nAcquire::http::Timeout "20";\nAcquire::Retries "0";\nDPkg::Lock::Timeout "60";\n' > /etc/apt/apt.conf.d/99-no-languages
        {% if lxc_apt_proxy | length > 0 %}
        # Cache apt (apt-cacher-ng...) : evite de retelecharger les memes
        # paquets pour chaque conteneur.
        printf 'Acquire::http::Proxy "{{ lxc_apt_proxy }}";\n' > /etc/apt/apt.conf.d/01proxy
        {% else %}
        rm -f /etc/apt/apt.conf.d/01proxy
        {% endif %}

        # Meme cause que roles/odoo14/files/apt-realign, mais ici python3-apt
        # n'existe pas encore : version shell.
        # Cette fonction repondait au parc Debian 11, dont l'image embarquait
        # des paquets en version "security" absente des depots encore servis,
        # ce qu'apt ne sait pas retrograder seul. Sous Debian 12 les depots
        # sont coherents : elle est conservee en filet de securite et ne
        # trouve normalement rien a retrograder.
        # Le principe : retrograder en UNE SEULE transaction (les paquets
        # lies par une dependance stricte doivent bouger ensemble) tout paquet
        # installe en version superieure a la meilleure version REELLEMENT
        # telechargeable.
        realign_apt() {
          declare -A inst best
          # "apt-cache policy" est inutilisable ici : pour un paquet installe
          # dans une version absente de tout depot, il renvoie comme candidate
          # la version installee elle-meme, et le paquet passe inapercu.
          # "apt-cache madison" ne liste que ce qui est dans un depot.
          while read -r p v; do
            inst["$p"]="$v"
          done < <(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null)
          # NB : jamais la forme "dollar-accolade-diese" (cardinal d'un
          # tableau) dans ce script -- Ansible le passe d'abord dans Jinja2,
          # qui lit accolade-diese comme un debut de commentaire et echoue
          # sur "Missing end of comment tag", avant meme toute execution.
          [ -n "${inst[*]}" ] || return 0
          while read -r p v; do
            [ -n "${inst[$p]+x}" ] || continue
            if [ -z "${best[$p]}" ] || dpkg --compare-versions "$v" gt "${best[$p]}"; then
              best["$p"]="$v"
            fi
          done < <(apt-cache madison "${!inst[@]}" 2>/dev/null \
                   | awk -F'|' '/Packages$/ { gsub(/^ +| +$/, "", $1);
                                              gsub(/^ +| +$/, "", $2);
                                              print $1, $2 }')
          local targets=""
          local p
          for p in "${!best[@]}"; do
            if dpkg --compare-versions "${inst[$p]}" gt "${best[$p]}"; then
              targets="$targets $p=${best[$p]}"
            fi
          done
          if [ -z "$targets" ]; then
            echo "--- realignement: aucune retrogradation necessaire ---"
            return 0
          fi
          echo "--- realignement:$targets ---"
          apt-get install -y --allow-downgrades $targets || true
          dpkg --configure -a || true
          apt-get -y --fix-broken install || true
        }

        # Paquets indispensables pour la suite :
        #  - openssh-server : Ansible atteint le conteneur en SSH (plays 2 et 3)
        #  - python3        : sans lui, tout module Ansible echoue en "not found"
        #  - python3-apt    : requis par le module apt d'Ansible
        # dpkg -s est la seule preuve fiable qu'un paquet est installe :
        # "command -v" peut reussir sur un residu et masquer un apt rate.
        REQUIRED="openssh-server python3 python3-apt"
        missing=""
        for p in $REQUIRED; do
          dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
        done

        if [ -n "$missing" ]; then
          # Echec rapide si le reseau/DNS du conteneur ne marche pas, plutot
          # que de laisser apt attendre.
          echo "--- reseau ---"
          getent hosts deb.debian.org || echo "DNS KO (resolv.conf ci-dessous)"
          cat /etc/resolv.conf
          ip -4 r
          # Un seul apt-get update par tentative, et seulement si quelque chose
          # manque. realign_apt (couteux) n'est lance qu'apres un premier echec :
          # sous Debian 12 l'installation passe normalement du premier coup.
          installed=0
          for i in 1 2 3; do
            echo "--- tentative apt $i (manquants:$missing) ---"
            if apt-get update && apt-get install -y $missing; then
              installed=1; break
            fi
            [ "$i" = "1" ] && realign_apt
            sleep 5
          done
          if [ "$installed" != "1" ]; then
            echo "ECHEC: installation de$missing impossible apres 3 tentatives."
            echo "--- DNS ---"; getent hosts deb.debian.org || echo "resolution KO"
            echo "--- routes ---"; ip r
            echo "--- resolv.conf ---"; cat /etc/resolv.conf
            exit 10
          fi
        fi

        for p in $REQUIRED; do
          dpkg -s "$p" >/dev/null 2>&1 || { echo "ECHEC: $p absent apres installation"; exit 10; }
        done

        install -d -m 700 /root/.ssh
        touch /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
        grep -qF "{{ controller_ssh_pubkey }}" /root/.ssh/authorized_keys \
          || echo "{{ controller_ssh_pubkey }}" >> /root/.ssh/authorized_keys
        sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config

        # Les cles d'hote manquent parfois en conteneur : sshd refuse de demarrer.
        ssh-keygen -A

        systemctl enable ssh
        systemctl restart ssh
        if ! systemctl is-active --quiet ssh; then
          echo "ECHEC: ssh.service inactif"
          systemctl status ssh --no-pager -l || true
          journalctl -u ssh --no-pager -n 30 || true
          exit 11
        fi
        if ! ss -ltn | grep -qE '(0\.0\.0\.0|\[::\]):22[[:space:]]'; then
          echo "ECHEC: rien n'ecoute sur :22"
          ss -ltn
          exit 12
        fi
        # Ansible utilise cet interpreteur (cf. ansible_python_interpreter
        # dans inventory.yaml) : on verifie qu'il repond vraiment.
        /usr/bin/python3 -c 'import sys; print("python", sys.version.split()[0])' \
          || { echo "ECHEC: /usr/bin/python3 inutilisable"; exit 13; }

        echo "BOOTSTRAP_SSH_OK"
  register: _ssh_bootstrap
  changed_when: true
  # lxc-attach renvoie toujours 0 (LXC 3.0.4) : on valide sur le marqueur.
  failed_when: "'BOOTSTRAP_SSH_OK' not in _ssh_bootstrap.stdout"

# Vu depuis le POSTE DE CONTROLE, et non depuis l'hote : en macvlan l'hote ne
# joint pas son propre conteneur, et ce test echouerait sur un conteneur sain.
# C'est de toute facon le poste de controle qui doit l'atteindre ensuite.
- name: Attendre que le port SSH du conteneur soit ouvert (vu du poste de controle)
  ansible.builtin.wait_for:
    host: "{{ ct_ip }}"
    port: 22
    timeout: 120
    delay: 2
  delegate_to: localhost
  become: false
