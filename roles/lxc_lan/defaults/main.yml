---
# Carte reseau de l'hote utilisee par le conteneur. Surchargeable par hote.
nic: ens224

# Mode de raccordement du conteneur au LAN :
#   phys    : la carte {{ nic }} est CEDEE au conteneur et disparait de
#             l'hote. Exige une carte dediee, distincte de celle qui porte la
#             route par defaut de l'hote.
#   macvlan : le conteneur obtient une interface virtuelle, avec sa propre
#             MAC, posee sur {{ nic }}. L'hote GARDE sa carte : c'est le seul
#             mode possible quand l'hote n'a qu'une carte sur ce reseau.
#             Contrepartie : l'hote ne joint pas son propre conteneur par
#             cette carte (limite noyau du macvlan), les autres machines si.
lxc_net_type: phys

# Mode macvlan. "bridge" laisse communiquer entre eux les conteneurs d'un
# meme hote ; il ne change rien a la limite hote <-> conteneur.
lxc_macvlan_mode: bridge

# Adressage du conteneur. ct_ip est obligatoire et defini par hote
# (host_vars/<ip>.yml). La passerelle et les DNS se rabattent sur la
# passerelle de l'hote, ce qui ne vaut que si l'hote et le conteneur sont sur
# le meme sous-reseau : sinon, les definir dans host_vars.
ct_prefix: 24
ct_gateway: "{{ ansible_default_ipv4.gateway }}"
ct_dns_servers:
  - "{{ ct_gateway }}"

# Nom du conteneur LXC : defini par hote dans host_vars/<ip>.yml.
lxc_container_name: devodoo14

# Retirer activement l'ancien modele routé (lxcbr0 + DNAT + routes). Laisse
# en place, il redirige le port 8069 de l'hote vers une IP 10.0.x.10 qui
# n'existe plus : une panne du type "ca marchait hier" difficile a lire.
lxc_undo_routed: true

# Sous-reseaux et IP de l'ancien modele, a demonter.
lxc_legacy_networks:
  - 10.0.1.0/24
  - 10.0.2.0/24
  - 10.0.3.0/24
  - 10.0.4.0/24
lxc_legacy_container_ips:
  - 10.0.1.10
  - 10.0.2.10
  - 10.0.3.10
  - 10.0.4.10
lxc_legacy_web_port: 8069

# Cle publique du poste de controle a injecter dans le conteneur.
# Surchargeable : -e controller_ssh_pubkey="ssh-ed25519 AAAA..."
# ou par la variable d'environnement PROSYS_CONTROLLER_SSH_PUBKEY (cf. .env).
controller_ssh_pubkey: "{{ lookup('env', 'PROSYS_CONTROLLER_SSH_PUBKEY') | default(lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub', errors='warn'), true) | default('', true) }}"
