---
- name: restart odoo
  ansible.builtin.service:
    name: odoo
    state: restarted

- name: restart postgresql
  ansible.builtin.service:
    name: postgresql
    state: restarted

# pg_hba.conf ne demande qu'un rechargement, pas une coupure des connexions.
- name: reload postgresql
  ansible.builtin.service:
    name: postgresql
    state: reloaded
