---
# ===========================================================================
# Role odoo14  -  execute DANS les conteneurs (groupe odoo_containers, Debian 11)
# Installe Odoo 14 depuis le depot APT nightly officiel + PostgreSQL.
# ===========================================================================

- name: Afficher la cible
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} ({{ ansible_host }}) - instance Odoo autonome"

- name: Assainir les sources APT (Debian 11 en fin de vie)
  ansible.builtin.import_tasks: apt_sources.yaml

- name: Installer les dependances de base
  ansible.builtin.apt:
    name:
      # gpgv est liste explicitement avec gnupg : sans cela apt refuse de
      # mettre a jour l'un sans l'autre ("held broken packages").
      - gnupg
      - gpgv
      - wget
      - ca-certificates
      - python3-pip
      - fonts-liberation
      - rsync
      - wkhtmltopdf
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------------------------------------------------------------------------
# PostgreSQL - serveur
# Le paquet Debian d'Odoo ne depend que de postgresql-CLIENT : sans cette
# tache il n'y a aucun serveur, et "service postgresql" n'existe pas.
# Il doit tourner AVANT qu'Odoo ne demarre, sinon Odoo boucle sur l'echec
# de connexion a la base.
# ---------------------------------------------------------------------------
- name: Installer le serveur PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - "postgresql-{{ pg_version }}"
      - postgresql-client
      - python3-psycopg2
    state: present

- name: Demarrer PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# ---------------------------------------------------------------------------
# Depot Odoo nightly
# ---------------------------------------------------------------------------
- name: Recuperer la cle du depot Odoo
  ansible.builtin.get_url:
    url: "{{ odoo_nightly_key_url }}"
    dest: /usr/share/keyrings/odoo-archive-keyring.asc
    mode: "0644"
    timeout: 30
  register: _odoo_key
  until: _odoo_key is succeeded
  retries: 5
  delay: 10

- name: Ajouter le depot Odoo nightly {{ odoo_version }}
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/odoo-archive-keyring.asc] {{ odoo_nightly_repo }}"
    filename: odoo
    state: present
    update_cache: true

- name: Installer Odoo {{ odoo_version }}
  ansible.builtin.apt:
    name: odoo
    state: present
  notify: restart odoo

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
- name: Creer le repertoire de log Odoo
  ansible.builtin.file:
    path: "{{ odoo_log_path | dirname }}"
    state: directory
    owner: "{{ odoo_system_user }}"
    group: "{{ odoo_system_user }}"
    mode: "0755"

- name: Deposer /etc/odoo/odoo.conf
  ansible.builtin.template:
    src: odoo.conf.j2
    dest: "{{ odoo_config_path }}"
    owner: "{{ odoo_system_user }}"
    group: "{{ odoo_system_user }}"
    mode: "0640"
  notify: restart odoo

- name: S'assurer que l'arborescence du filestore existe
  ansible.builtin.file:
    path: "{{ odoo_filestore }}"
    state: directory
    owner: "{{ odoo_system_user }}"
    group: "{{ odoo_system_user }}"
    mode: "0750"

- name: Effacer les reliquats de l'ancienne architecture repliquee
  ansible.builtin.import_tasks: purge_replication.yaml

# ---------------------------------------------------------------------------
# Role SQL et base locale - chaque noeud a la sienne, aucun partage
# ---------------------------------------------------------------------------
- name: Creer le role PostgreSQL odoo avec CREATEDB
  community.postgresql.postgresql_user:
    name: "{{ odoo_db_user }}"
    password: "{{ odoo_db_password }}"
    # role_attr_flags est OBLIGATOIRE : sans lui le module remet les attributs
    # a leurs valeurs par defaut et retire CREATEDB, ce qui donne
    # "permission denied to create database" au premier demarrage d'Odoo.
    role_attr_flags: "LOGIN,CREATEDB"
    state: present
  become: true
  become_user: postgres

# Tester la simple EXISTENCE de la base ne suffit pas : une base creee mais
# dont l'initialisation a echoue reste presente et vide, et Odoo repond 500
# sans jamais pouvoir se reparer. On teste donc sa VALIDITE.
- name: Determiner l'etat de la base Odoo
  ansible.builtin.shell: |
    set -u
    cd /tmp
    if ! psql -tAc "select 1 from pg_database where datname='{{ odoo_initial_db }}'" | grep -q 1; then
      echo ABSENTE
    elif [ "$(psql -d '{{ odoo_initial_db }}' -tAc \
              "select count(*) from information_schema.tables where table_schema='public'")" -eq 0 ]; then
      echo VIDE
    else
      echo VALIDE
    fi
  become: true
  become_user: postgres
  register: _db_state
  changed_when: false
  when: odoo_initial_db | length > 0

- name: Afficher l'etat de la base
  ansible.builtin.debug:
    msg: "base {{ odoo_initial_db }} : {{ _db_state.stdout | default('non geree') | trim }}"

- name: Reconstruire une base vide ou absente
  when:
    - odoo_initial_db | length > 0
    - _db_state.stdout | trim in ['ABSENTE', 'VIDE']
  block:
    - name: Arreter Odoo pendant l'initialisation
      ansible.builtin.service:
        name: odoo
        state: stopped

    # Sans danger : la base est vide, elle ne contient aucune donnee.
    - name: Supprimer la coquille vide
      community.postgresql.postgresql_db:
        name: "{{ odoo_initial_db }}"
        state: absent
      become: true
      become_user: postgres
      when: _db_state.stdout | trim == 'VIDE'

    - name: Initialiser la base Odoo
      # list_db = False interdit le gestionnaire de bases web : la creation
      # passe forcement par la ligne de commande.
      ansible.builtin.command:
        argv:
          - odoo
          - -c
          - "{{ odoo_config_path }}"
          - --logfile=
          - -d
          - "{{ odoo_initial_db }}"
          - -i
          - base
          - --without-demo=all
          - --stop-after-init
      become: true
      become_user: "{{ odoo_system_user }}"
      changed_when: true

    - name: Confirmer que la base est desormais exploitable
      ansible.builtin.shell: >-
        cd /tmp && psql -d '{{ odoo_initial_db }}' -tAc
        "select count(*) from ir_module_module where state='installed'"
      become: true
      become_user: postgres
      register: _db_check
      changed_when: false
      failed_when: (_db_check.stdout | trim | int) < 1

    - name: Nombre de modules installes
      ansible.builtin.debug:
        msg: "{{ _db_check.stdout | trim }} module(s) installe(s) dans {{ odoo_initial_db }}"

- name: Demarrer les handlers en attente (avant de figer l'etat des services)
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# Etat des services selon le role
# ---------------------------------------------------------------------------
- name: PostgreSQL actif et persistant sur tous les noeuds
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Odoo actif sur chaque noeud
  ansible.builtin.service:
    name: odoo
    state: started
    enabled: true
