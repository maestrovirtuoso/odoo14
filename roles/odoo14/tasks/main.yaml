---
# ===========================================================================
# Role odoo14  -  execute DANS les conteneurs (groupe odoo_containers, Debian 11)
# Installe Odoo 14 depuis le depot APT nightly officiel + PostgreSQL.
# ===========================================================================

- name: Afficher la cible
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} ({{ ansible_host }}) - instance Odoo autonome"

- name: Assainir les sources APT (Debian 11 en fin de vie)
  ansible.builtin.import_tasks: apt_sources.yaml

- name: Installer les dependances de base
  ansible.builtin.apt:
    name:
      # gpgv est liste explicitement avec gnupg : sans cela apt refuse de
      # mettre a jour l'un sans l'autre ("held broken packages").
      - gnupg
      - gpgv
      - wget
      - ca-certificates
      - python3-pip
      - fonts-liberation
      - rsync
      - wkhtmltopdf
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------------------------------------------------------------------------
# PostgreSQL - serveur
# Le paquet Debian d'Odoo ne depend que de postgresql-CLIENT : sans cette
# tache il n'y a aucun serveur, et "service postgresql" n'existe pas.
# Il doit tourner AVANT qu'Odoo ne demarre, sinon Odoo boucle sur l'echec
# de connexion a la base.
# ---------------------------------------------------------------------------
- name: Installer le serveur PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - "postgresql-{{ pg_version }}"
      - postgresql-client
      - python3-psycopg2
    state: present

- name: Demarrer PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# ---------------------------------------------------------------------------
# Depot Odoo nightly
# ---------------------------------------------------------------------------
- name: Recuperer la cle du depot Odoo
  ansible.builtin.get_url:
    url: "{{ odoo_nightly_key_url }}"
    dest: /usr/share/keyrings/odoo-archive-keyring.asc
    mode: "0644"
    timeout: 30
  register: _odoo_key
  until: _odoo_key is succeeded
  retries: 5
  delay: 10

- name: Ajouter le depot Odoo nightly {{ odoo_version }}
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/odoo-archive-keyring.asc] {{ odoo_nightly_repo }}"
    filename: odoo
    state: present
    update_cache: true

- name: Installer Odoo {{ odoo_version }}
  ansible.builtin.apt:
    name: odoo
    state: present
  notify: restart odoo

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
- name: Creer le repertoire de log Odoo
  ansible.builtin.file:
    path: "{{ odoo_log_path | dirname }}"
    state: directory
    owner: "{{ odoo_system_user }}"
    group: "{{ odoo_system_user }}"
    mode: "0755"

- name: Deposer /etc/odoo/odoo.conf
  ansible.builtin.template:
    src: odoo.conf.j2
    dest: "{{ odoo_config_path }}"
    owner: "{{ odoo_system_user }}"
    group: "{{ odoo_system_user }}"
    mode: "0640"
  notify: restart odoo

- name: S'assurer que l'arborescence du filestore existe
  ansible.builtin.file:
    path: "{{ odoo_filestore }}"
    state: directory
    owner: "{{ odoo_system_user }}"
    group: "{{ odoo_system_user }}"
    mode: "0750"

# ---------------------------------------------------------------------------
# Autonomie du noeud
#
# Un noeud precedemment configure en standby de replication tourne en mode
# recovery : sa base est en LECTURE SEULE et Odoo ne peut pas y ecrire. On le
# promeut pour le rendre independant, et on retire les reliquats de
# replication (standby.signal est consomme par la promotion, il reste le
# fichier de conf et primary_conninfo).
# ---------------------------------------------------------------------------
- name: Determiner si PostgreSQL est en mode recovery
  community.postgresql.postgresql_query:
    query: "SELECT pg_is_in_recovery() AS in_recovery"
  become: true
  become_user: postgres
  register: _pg_recovery
  changed_when: false

- name: Rendre le noeud autonome (sortie du mode standby)
  when: _pg_recovery.query_result[0].in_recovery | bool
  block:
    - name: Promouvoir l'instance PostgreSQL
      ansible.builtin.command: "pg_ctlcluster {{ pg_version }} main promote"
      become: true
      become_user: postgres
      changed_when: true

    - name: Attendre la sortie du mode recovery
      community.postgresql.postgresql_query:
        query: "SELECT pg_is_in_recovery() AS in_recovery"
      become: true
      become_user: postgres
      register: _pg_after
      until: not (_pg_after.query_result[0].in_recovery | bool)
      retries: 15
      delay: 2
      changed_when: false

- name: Retirer les reliquats de configuration de replication
  ansible.builtin.file:
    path: "{{ pg_conf_dir }}/conf.d/replication.conf"
    state: absent
  notify: restart postgresql

- name: Retirer primary_conninfo de postgresql.auto.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.auto.conf"
    regexp: '^primary_conninfo'
    state: absent
  failed_when: false
  notify: restart postgresql

# ---------------------------------------------------------------------------
# Role SQL et base locale - chaque noeud a la sienne, aucun partage
# ---------------------------------------------------------------------------
- name: Creer le role PostgreSQL odoo avec CREATEDB
  community.postgresql.postgresql_user:
    name: "{{ odoo_db_user }}"
    password: "{{ odoo_db_password }}"
    # role_attr_flags est OBLIGATOIRE : sans lui le module remet les attributs
    # a leurs valeurs par defaut et retire CREATEDB, ce qui donne
    # "permission denied to create database" au premier demarrage d'Odoo.
    role_attr_flags: "LOGIN,CREATEDB"
    state: present
  become: true
  become_user: postgres

- name: Verifier si la base locale existe deja
  community.postgresql.postgresql_query:
    query: "SELECT 1 FROM pg_database WHERE datname = %(db)s"
    named_args:
      db: "{{ odoo_initial_db }}"
  become: true
  become_user: postgres
  register: _db_present
  changed_when: false
  when: odoo_initial_db | length > 0

- name: Initialiser la base Odoo
  # list_db = False interdit le gestionnaire de bases web : la creation passe
  # forcement par la ligne de commande.
  ansible.builtin.command:
    argv:
      - odoo
      - -c
      - "{{ odoo_config_path }}"
      - --logfile=
      - -d
      - "{{ odoo_initial_db }}"
      - -i
      - base
      - --without-demo=all
      - --stop-after-init
  become: true
  become_user: "{{ odoo_system_user }}"
  register: _db_init
  changed_when: true
  when:
    - odoo_initial_db | length > 0
    - _db_present.query_result | default([]) | length == 0

- name: Demarrer les handlers en attente (avant de figer l'etat des services)
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# Etat des services selon le role
# ---------------------------------------------------------------------------
- name: PostgreSQL actif et persistant sur tous les noeuds
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Odoo actif sur chaque noeud
  ansible.builtin.service:
    name: odoo
    state: started
    enabled: true
