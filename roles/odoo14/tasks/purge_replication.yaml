---
# ---------------------------------------------------------------------------
# Demantelement de l'ancienne architecture repliquee - partie conteneur Odoo
#
# Ce projet a d'abord deploye une replication PostgreSQL streaming (un
# primaire, deux standbys), puis des instances autonomes. Les taches
# ci-dessous effacent ce que la replication avait laisse DANS LES CONTENEURS
# ODOO. Elles sont idempotentes.
#
# La partie PostgreSQL de cette purge (replication.conf, standby.signal,
# .pgpass) vit desormais dans roles/pg_server/tasks/purge_replication.yaml :
# ces chemins n'existent plus dans un conteneur Odoo, qui n'heberge plus de
# serveur, et la tache y notifiait un handler "restart postgresql" disparu.
# ---------------------------------------------------------------------------

# --- 1. Synchronisation du filestore --------------------------------------
- name: Supprimer les unites et le script de synchro du filestore
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/odoo-filestore-sync.timer
    - /etc/systemd/system/odoo-filestore-sync.service
    - /usr/local/bin/odoo-filestore-sync.sh
  register: _fs_units

- name: Recharger systemd apres suppression des unites
  ansible.builtin.systemd:
    daemon_reload: true
  when: _fs_units is changed

# --- 2. Cle SSH de la synchro filestore -----------------------------------
# Le primaire generait une paire de cles pour pousser le filestore par rsync,
# et sa cle publique etait autorisee sur les autres noeuds. Son commentaire
# (root@devodoo14) la distingue de celle du poste de controle, a conserver.
- name: Supprimer la cle SSH generee pour la synchro du filestore
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.ssh/id_ed25519
    - /root/.ssh/id_ed25519.pub

- name: Revoquer cette cle des authorized_keys
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    regexp: 'root@{{ lxc_container_name | default("devodoo14") }}\s*$'
    state: absent
  failed_when: false
