---
# Valeurs par defaut du role odoo14 (surchargees par group_vars/odoo_containers).
# Miroir Debian principal. Bascule automatique sur archive.debian.org s'il
# ne repond plus (cf. tasks/apt_sources.yaml).
debian_mirror: http://deb.debian.org/debian

odoo_version: "14.0"
odoo_nightly_repo: "https://nightly.odoo.com/{{ odoo_version }}/nightly/deb/ ./"
odoo_nightly_key_url: "https://nightly.odoo.com/odoo.key"

odoo_system_user: odoo
odoo_db_user: odoo
odoo_admin_password: admin
odoo_db_password: odoo
odoo_list_db: false
odoo_config_path: /etc/odoo/odoo.conf
odoo_log_path: /var/log/odoo/odoo.log
odoo_addons_path: /usr/lib/python3/dist-packages/odoo/addons
odoo_filestore: /var/lib/odoo/.local/share/Odoo/filestore

# odoo_role est defini par hote dans l'inventaire (primary | standby).
odoo_role: standby

# Version PostgreSQL livree par Debian 11 bullseye.
pg_version: "13"

# Base Odoo creee au premier deploiement sur le primaire.
# Mettre "" pour ne creer aucune base.
odoo_initial_db: prod
